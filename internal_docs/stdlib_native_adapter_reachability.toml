# Public callable adapters in sifr_stdlib that are intentionally consumed by
# compiler-generated Rust rather than by a private stdlib @rust declaration.
# Every other statically declared public callable must be an active @rust target.

schema_version = 1

[[substrate]]
adapter = "python.reconcile_arrow_argument"
reason = "Generated Python declaration glue combines the Python call outcome with exact Arrow owned-argument consumption cleanup."
consumer_files = ["crates/sifr_codegen/src/python_arrow_codegen.rs"]

[[substrate]]
adapter = "python.reconcile_dlpack_argument"
reason = "Generated Python declaration glue combines the Python call outcome with exact DLPack one-shot consumption cleanup."
consumer_files = ["crates/sifr_codegen/src/python_dlpack_codegen.rs"]

[[substrate]]
adapter = "python.py_call_keyed"
reason = "Generated typed raw Object.call glue accepts the public (str, Object) keyword shape over the canonical sealed Python identity."
consumer_files = ["crates/sifr_codegen/src/python_raw_api_codegen.rs"]

[[substrate]]
adapter = "python.py_call_attr_keyed"
reason = "Generated typed raw Object.call_method glue accepts the public (str, Object) keyword shape over the canonical sealed Python identity."
consumer_files = ["crates/sifr_codegen/src/python_raw_api_codegen.rs"]

[[substrate]]
adapter = "process.process_child_close"
reason = "Generated resource Drop glue closes process-child handles even when user code does not call an explicit close declaration."
consumer_files = ["crates/sifr_codegen/src/class_emitter.rs"]

[[substrate]]
adapter = "process.process_async_register_scoped_child"
reason = "Generated task-scope glue registers an async child with compiler-owned observation state."
consumer_files = ["crates/sifr_codegen/src/preamble/task_scope_offload_runtime.rs"]

[[substrate]]
adapter = "process.process_async_take_child"
reason = "Generated task-scope glue takes ownership of a registered async child before awaiting it."
consumer_files = ["crates/sifr_codegen/src/preamble/task_scope_offload_runtime.rs"]

[[substrate]]
adapter = "process.process_async_remove_observed"
reason = "Generated task-scope cleanup removes completed child-observation state."
consumer_files = ["crates/sifr_codegen/src/preamble/task_scope_offload_runtime.rs"]
