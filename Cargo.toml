[workspace]
members = [
    "crates/sifr_source",
    "crates/sifr_sysroot",
    "crates/sifr_diagnostics",
    "crates/sifr_runtime",
    "crates/sifr_structural_identity",
    "crates/sifr_compiler_component",
    "crates/sifr_sql_contract",
    "crates/sifr_sql_tool",
    "crates/sifr_sql_runtime",
    "crates/sifr_sql_postgresql",
    "crates/sifr_sql_postgresql_runtime",
    "crates/sifr_sql_postgresql_tools",
    "crates/sifr_sql_mysql",
    "crates/sifr_sql_mysql_runtime",
    "crates/sifr_sql_mysql_tools",
    "crates/sifr_sql_sqlite",
    "crates/sifr_sql_sqlite_runtime",
    "crates/sifr_sql_sqlite_tools",
    "crates/sifr_stdlib",
    "crates/sifr_type_system",
    "crates/sifr_ipc",
    "crates/sifr_stdlib_imports",
    "crates/sifr_stdlib_manifest",
    "crates/sifr_ir",
    "crates/sifr_lowering",
    "crates/sifr_syntax",
    "crates/sifr_frontend",
    "crates/sifr_format",
    "crates/sifr_lint",
    "crates/sifr_analysis",
    "crates/sifr_lsp",
    "crates/sifr_package",
    "crates/sifr_codegen",
    "crates/sifr_driver",
    "crates/sifr",
    "crates/sifr_rust_interop_catalog",
    "crates/sifr_sql_dependency_lock",
]
exclude = ["tmp", "sifr_output", "third_party/ruff"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
homepage = "https://github.com/sifr-lang/sifr"
documentation = "https://github.com/sifr-lang/sifr"
repository = "https://github.com/sifr-lang/sifr"
authors = ["Yaser Al-Najjar"]
license = "MIT"

[workspace.dependencies]
# Infrastructure crates -- unmodified, referenced from the Ruff fork submodule.
ruff_text_size = { path = "third_party/ruff/crates/ruff_text_size" }
ruff_source_file = { path = "third_party/ruff/crates/ruff_source_file" }
ruff_python_trivia = { path = "third_party/ruff/crates/ruff_python_trivia" }
ruff_python_literal = { path = "third_party/ruff/crates/ruff_python_literal" }
ruff_formatter = { path = "third_party/ruff/crates/ruff_formatter" }
ruff_python_formatter = { path = "third_party/ruff/crates/ruff_python_formatter" }

# Parser/AST crates -- maintained in the Ruff fork submodule and imported under Sifr crate aliases.
ruff_python_ast = { path = "third_party/ruff/crates/ruff_python_ast" }
ruff_python_parser = { path = "third_party/ruff/crates/ruff_python_parser" }
sifr_python_ast = { package = "ruff_python_ast", path = "third_party/ruff/crates/ruff_python_ast" }
sifr_python_parser = { package = "ruff_python_parser", path = "third_party/ruff/crates/ruff_python_parser" }

# Sifr-specific crates
sifr_diagnostics = { path = "crates/sifr_diagnostics" }
sifr_source = { path = "crates/sifr_source" }
sifr_sysroot = { path = "crates/sifr_sysroot" }
sifr_runtime = { path = "crates/sifr_runtime" }
sifr_structural_identity = { path = "crates/sifr_structural_identity" }
sifr_compiler_component = { path = "crates/sifr_compiler_component" }
sifr_sql_contract = { path = "crates/sifr_sql_contract" }
sifr_sql_tool = { path = "crates/sifr_sql_tool" }
sifr_sql_runtime = { path = "crates/sifr_sql_runtime" }
sifr_sql_postgresql = { path = "crates/sifr_sql_postgresql" }
sifr_sql_postgresql_runtime = { path = "crates/sifr_sql_postgresql_runtime" }
sifr_sql_postgresql_tools = { path = "crates/sifr_sql_postgresql_tools" }
sifr_sql_mysql = { path = "crates/sifr_sql_mysql" }
sifr_sql_mysql_runtime = { path = "crates/sifr_sql_mysql_runtime" }
sifr_sql_mysql_tools = { path = "crates/sifr_sql_mysql_tools" }
sifr_sql_sqlite = { path = "crates/sifr_sql_sqlite" }
sifr_sql_sqlite_runtime = { path = "crates/sifr_sql_sqlite_runtime" }
sifr_sql_sqlite_tools = { path = "crates/sifr_sql_sqlite_tools" }
sifr_stdlib = { path = "crates/sifr_stdlib" }
sifr_type_system = { path = "crates/sifr_type_system" }
sifr_ipc = { path = "crates/sifr_ipc" }
sifr_stdlib_imports = { path = "crates/sifr_stdlib_imports" }
sifr_stdlib_manifest = { path = "crates/sifr_stdlib_manifest" }
sifr_ir = { path = "crates/sifr_ir" }
sifr_lowering = { path = "crates/sifr_lowering" }
sifr_syntax = { path = "crates/sifr_syntax" }
sifr_frontend = { path = "crates/sifr_frontend" }
sifr_format = { path = "crates/sifr_format" }
sifr_lint = { path = "crates/sifr_lint" }
sifr_analysis = { path = "crates/sifr_analysis" }
sifr_lsp = { path = "crates/sifr_lsp" }
sifr_package = { path = "crates/sifr_package" }
sifr_codegen = { path = "crates/sifr_codegen" }
sifr_driver = { path = "crates/sifr_driver" }

# External dependencies (latest stable for Sifr; the excluded Ruff fork carries its own pins).
aho-corasick = { version = "1.1.5" }
annotate-snippets = { version = "0.12.16", features = ["color"] }
anyhow = { version = "1.0.104" }
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
bigdecimal = { version = "0.4.10", features = ["serde"] }
bitflags = { version = "2.13.1" }
blake2 = { version = "0.10.6" }
bstr = { version = "1.13.1" }
bytes = { version = "1.12.1" }
cc = { version = "=1.4.4", default-features = false }
chrono = { version = "0.4.45" }
encoding_rs = { version = "0.8.35" }
flate2 = { version = "1.1.9" }
futures-core = { version = "0.3.34", default-features = false, features = ["std"] }
globset = { version = "0.4.20" }
h2 = { version = "0.4.19" }
http-body = { version = "1.1.0" }
http-body-util = { version = "0.1.5", default-features = false }
hyper = { version = "1.11.0", default-features = false, features = ["client", "http1", "http2", "server"] }
hyper-util = { version = "0.1.20", default-features = false, features = ["tokio"] }
icu_collator = { version = "2.3.1" }
icu_datetime = { version = "2.3.0" }
icu_decimal = { version = "2.3.0" }
icu_locale = { version = "2.3.1" }
icu_plurals = { version = "2.3.0" }
ignore = { version = "0.4.33" }
insta = { version = "1.48.0" }
is-macro = { version = "0.3.8" }
itertools = { version = "0.15.0", default-features = false, features = ["use_std"] }
indexmap = { version = "2.14.0" }
lsp-server = { version = "0.10.0" }
lsp-types = { version = "0.97.0" }
libc = { version = "0.2.189" }
md5 = { version = "0.8.1" }
memchr = { version = "2.8.3" }
metrics = { version = "0.24.6" }
once_cell = { version = "1.21.4" }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
pyo3 = { version = "0.29.2", default-features = false }
rand = { version = "0.10.2" }
rand_distr = { version = "0.6.0" }
rayon = { version = "1.12.0" }
rcgen = { version = "0.14.9" }
regex = { version = "1.13.1" }
num-bigint = { version = "0.5.1", default-features = false, features = ["std"] }
num-traits = { version = "0.2.19" }
cookie = { version = "0.18.2", default-features = false }
http = { version = "1.5.0" }
percent-encoding = { version = "2.3.2" }
rustls = { version = "=0.23.43", default-features = false, features = ["aws_lc_rs", "logging", "prefer-post-quantum", "std", "tls12"] }
rustls-pemfile = { version = "2.2.0" }
rustls-platform-verifier = { version = "=0.7.0", default-features = false }
rust_decimal = { version = "1.42.1", features = ["maths", "serde-with-str"] }
rustc-hash = { version = "2.1.3" }
schemars = { version = "1.2.2" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
semver = { version = "1.0.28", features = ["serde"] }
serde_test = { version = "1.0.177" }
sha1 = { version = "0.11.0" }
sha2 = { version = "0.11.0" }
static_assertions = { version = "1.1.0" }
syn = { version = "3.0.4", default-features = false, features = ["clone-impls", "full", "parsing", "visit"] }
toml = { version = "1.1.4", features = ["preserve_order"] }
tokio = { version = "=1.53.1", default-features = false, features = ["io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["aws_lc_rs", "logging", "tls12"] }
postgres-types = { version = "=0.2.14", default-features = false }
tokio-postgres = { version = "=0.7.18", default-features = false }
tokio-postgres-rustls = { version = "=0.14.0", default-features = false }
lalrpop = { version = "=0.23.1", default-features = false }
lalrpop-util = { version = "=0.23.1", default-features = false }
mysql_async = { version = "=0.37.0", default-features = false }
mysql_common = { version = "=0.37.3", default-features = false }
syntaqlite = { version = "=0.9.0", default-features = false }
rusqlite = { version = "=0.40.2", default-features = false }
libsqlite3-sys = { version = "=0.38.2", default-features = false }
tower-service = { version = "0.3.3" }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
unic-ucd-category = { version = "0.9" }
unicode-ident = { version = "1.0.24" }
unicode_names2 = { version = "3.1.0" }
unicode-normalization = { version = "0.1.25" }
unicode-segmentation = { version = "1.13.3" }
url = { version = "2.5.8" }
uuid = { version = "1.25.0", features = ["v3", "v4", "v5"] }
walkdir = { version = "2.5.0" }
wasmtime = { version = "=48.0.1", default-features = false, features = ["component-model", "cranelift", "gc-null", "runtime", "std"] }
wit-bindgen = { version = "=0.61.1", default-features = false, features = ["macros", "realloc", "std"] }
wat = { version = "=1.258.0" }
zip_8_6 = { package = "zip", version = "8.6.0", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -2 }
char_lit_as_u8 = "allow"
collapsible_else_if = "allow"
collapsible_if = "allow"
implicit_hasher = "allow"
large_enum_variant = "allow"
map_unwrap_or = "allow"
manual_let_else = "allow"
match_same_arms = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
option_option = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
default_trait_access = "allow"
needless_raw_string_hashes = "allow"
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
# Production targets should stay free of unchecked unwrap/expect calls.
# Test targets allow these while assertion cleanup is handled separately.
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 16

[profile.release.package.ruff_python_parser]
codegen-units = 1
[profile.release.package.ruff_python_ast]
codegen-units = 1

[profile.dev.package.insta]
opt-level = 3
[profile.dev.package.similar]
opt-level = 3
[profile.dev.package.ruff_python_parser]
opt-level = 1
[profile.dev.package.sifr_lowering]
opt-level = 1
[profile.dev.package.sifr_type_system]
opt-level = 1
[profile.dev.package.sifr_codegen]
opt-level = 1
