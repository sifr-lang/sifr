[workspace]
members = [
    "crates/sifr_source",
    "crates/sifr_sysroot",
    "crates/sifr_diagnostics",
    "crates/sifr_runtime",
    "crates/sifr_stdlib",
    "crates/sifr_type_system",
    "crates/sifr_ipc",
    "crates/sifr_stdlib_imports",
    "crates/sifr_stdlib_manifest",
    "crates/sifr_ir",
    "crates/sifr_lowering",
    "crates/sifr_syntax",
    "crates/sifr_frontend",
    "crates/sifr_format",
    "crates/sifr_lint",
    "crates/sifr_analysis",
    "crates/sifr_lsp",
    "crates/sifr_package",
    "crates/sifr_codegen",
    "crates/sifr_driver",
    "crates/sifr",
]
exclude = ["tmp", "sifr_output", "third_party/ruff"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.93"
homepage = "https://github.com/sifr-lang/sifr"
documentation = "https://github.com/sifr-lang/sifr"
repository = "https://github.com/sifr-lang/sifr"
authors = ["Yaser Al-Najjar"]
license = "MIT"

[workspace.dependencies]
# Infrastructure crates -- unmodified, referenced from the Ruff fork submodule.
ruff_text_size = { path = "third_party/ruff/crates/ruff_text_size" }
ruff_source_file = { path = "third_party/ruff/crates/ruff_source_file" }
ruff_python_trivia = { path = "third_party/ruff/crates/ruff_python_trivia" }
ruff_python_literal = { path = "third_party/ruff/crates/ruff_python_literal" }
ruff_formatter = { path = "third_party/ruff/crates/ruff_formatter" }
ruff_python_formatter = { path = "third_party/ruff/crates/ruff_python_formatter" }

# Parser/AST crates -- maintained in the Ruff fork submodule and imported under Sifr crate aliases.
ruff_python_ast = { path = "third_party/ruff/crates/ruff_python_ast" }
ruff_python_parser = { path = "third_party/ruff/crates/ruff_python_parser" }
sifr_python_ast = { package = "ruff_python_ast", path = "third_party/ruff/crates/ruff_python_ast" }
sifr_python_parser = { package = "ruff_python_parser", path = "third_party/ruff/crates/ruff_python_parser" }

# Sifr-specific crates
sifr_diagnostics = { path = "crates/sifr_diagnostics" }
sifr_source = { path = "crates/sifr_source" }
sifr_sysroot = { path = "crates/sifr_sysroot" }
sifr_runtime = { path = "crates/sifr_runtime" }
sifr_stdlib = { path = "crates/sifr_stdlib" }
sifr_type_system = { path = "crates/sifr_type_system" }
sifr_ipc = { path = "crates/sifr_ipc" }
sifr_stdlib_imports = { path = "crates/sifr_stdlib_imports" }
sifr_stdlib_manifest = { path = "crates/sifr_stdlib_manifest" }
sifr_ir = { path = "crates/sifr_ir" }
sifr_lowering = { path = "crates/sifr_lowering" }
sifr_syntax = { path = "crates/sifr_syntax" }
sifr_frontend = { path = "crates/sifr_frontend" }
sifr_format = { path = "crates/sifr_format" }
sifr_lint = { path = "crates/sifr_lint" }
sifr_analysis = { path = "crates/sifr_analysis" }
sifr_lsp = { path = "crates/sifr_lsp" }
sifr_package = { path = "crates/sifr_package" }
sifr_codegen = { path = "crates/sifr_codegen" }
sifr_driver = { path = "crates/sifr_driver" }

# External dependencies (latest stable for Sifr; the excluded Ruff fork carries its own pins).
aho-corasick = { version = "1.1.4" }
annotate-snippets = { version = "0.12.15", features = ["color"] }
anyhow = { version = "1.0.102" }
base64 = { version = "0.22.1" }
bigdecimal = { version = "0.4.10", features = ["serde"] }
bitflags = { version = "2.11.1" }
blake2 = { version = "0.10.6" }
bstr = { version = "1.12.1" }
bytes = { version = "1.11.1" }
chrono = { version = "0.4.44" }
encoding_rs = { version = "0.8.35" }
flate2 = { version = "1.1.9" }
globset = { version = "0.4.18" }
h2 = { version = "0.4.14" }
http-body = { version = "1.0.1" }
http-body-util = { version = "0.1.3", default-features = false }
hyper = { version = "1.10.1", default-features = false, features = ["client", "http1", "http2", "server"] }
hyper-util = { version = "0.1.20", default-features = false, features = ["tokio"] }
icu_collator = { version = "2.2.0" }
icu_datetime = { version = "2.2.0" }
icu_decimal = { version = "2.2.0" }
icu_locale = { version = "2.2.0" }
icu_plurals = { version = "2.2.0" }
ignore = { version = "0.4.25" }
insta = { version = "1.47.2" }
is-macro = { version = "0.3.7" }
itertools = { version = "0.14.0" }
indexmap = { version = "2.12.1" }
lsp-server = { version = "0.7.8" }
lsp-types = { version = "0.97.0" }
libc = { version = "0.2.178" }
md5 = { version = "0.8.0" }
memchr = { version = "2.8.0" }
metrics = { version = "0.24.6" }
once_cell = { version = "1.21.4" }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
pyo3 = { version = "0.29.0", default-features = false }
rand = { version = "0.10.1" }
rand_distr = { version = "0.6.0" }
rayon = { version = "1.12.0" }
rcgen = { version = "0.14.8" }
regex = { version = "1.12.3" }
num-bigint = { version = "0.4.6" }
num-traits = { version = "0.2.19" }
cookie = { version = "0.18.1", default-features = false }
http = { version = "1.4.1" }
percent-encoding = { version = "2.3.2" }
rustls = { version = "=0.23.35" }
rustls-pemfile = { version = "2.2.0" }
rustls-platform-verifier = { version = "0.7.0", default-features = false }
rust_decimal = { version = "1.41.0", features = ["maths", "serde-with-str"] }
rustc-hash = { version = "2.1.2" }
schemars = { version = "1.2.1" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
serde_test = { version = "1.0.177" }
sha1 = { version = "0.11.0" }
sha2 = { version = "0.10.9" }
sha2_0_11 = { package = "sha2", version = "0.11.0" }
static_assertions = { version = "1.1.0" }
toml = { version = "1.1.2", features = ["preserve_order"] }
tokio = { version = "1.52.3", features = ["io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.4" }
tower-service = { version = "0.3.3" }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
unic-ucd-category = { version = "0.9" }
unicode-ident = { version = "1.0.24" }
unicode_names2 = { version = "3.1.0" }
unicode-normalization = { version = "0.1.25" }
unicode-segmentation = { version = "1.13.3" }
url = { version = "2.5.8" }
uuid = { version = "1.23.1", features = ["v3", "v4", "v5"] }
walkdir = { version = "2.5.0" }
zip_8_6 = { package = "zip", version = "8.6.0", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -2 }
char_lit_as_u8 = "allow"
collapsible_else_if = "allow"
collapsible_if = "allow"
implicit_hasher = "allow"
large_enum_variant = "allow"
map_unwrap_or = "allow"
manual_let_else = "allow"
match_same_arms = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
option_option = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
default_trait_access = "allow"
needless_raw_string_hashes = "allow"
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
# Production targets should stay free of unchecked unwrap/expect calls.
# Test targets allow these while assertion cleanup is handled separately.
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 16

[profile.release.package.ruff_python_parser]
codegen-units = 1
[profile.release.package.ruff_python_ast]
codegen-units = 1

[profile.dev.package.insta]
opt-level = 3
[profile.dev.package.similar]
opt-level = 3
[profile.dev.package.ruff_python_parser]
opt-level = 1
