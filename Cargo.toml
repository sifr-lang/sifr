[workspace]
members = [
    "crates/sifr_python_ast",
    "crates/sifr_python_parser",
    "crates/sifr_type_system",
    "crates/sifr_hir",
    "crates/sifr_codegen",
    "crates/sifr_driver",
    "crates/sifr",
]
exclude = ["tmp", "sifr_output"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.75"
homepage = "https://github.com/yaseralnajjar/sifr"
documentation = "https://github.com/yaseralnajjar/sifr"
repository = "https://github.com/yaseralnajjar/sifr"
authors = ["Yaser Al-Najjar"]
license = "MIT"

[workspace.dependencies]
# Infrastructure crates -- unmodified, referenced from ruff v0.4.10
ruff_text_size = { git = "https://github.com/astral-sh/ruff", tag = "v0.4.10" }
ruff_source_file = { git = "https://github.com/astral-sh/ruff", tag = "v0.4.10" }
ruff_python_trivia = { git = "https://github.com/astral-sh/ruff", tag = "v0.4.10" }
ruff_python_literal = { git = "https://github.com/astral-sh/ruff", tag = "v0.4.10" }

# Vendored forks -- kept for future modification (parser/AST may diverge from Python syntax)
sifr_python_ast = { path = "crates/sifr_python_ast" }
sifr_python_parser = { path = "crates/sifr_python_parser" }

# Sifr-specific crates
sifr_type_system = { path = "crates/sifr_type_system" }
sifr_hir = { path = "crates/sifr_hir" }
sifr_codegen = { path = "crates/sifr_codegen" }
sifr_driver = { path = "crates/sifr_driver" }

# External dependencies (versions from ruff upstream)
aho-corasick = { version = "1.1.3" }
annotate-snippets = { version = "0.9.2", features = ["color"] }
anyhow = { version = "1.0.80" }
bitflags = { version = "2.5.0" }
bstr = { version = "1.9.1" }
insta = { version = "1.35.1" }
is-macro = { version = "0.3.5" }
itertools = { version = "0.13.0" }
memchr = { version = "2.7.1" }
once_cell = { version = "1.19.0" }
rustc-hash = { version = "1.1.0" }
schemars = { version = "0.8.16" }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = { version = "1.0.113", features = ["preserve_order"] }
serde_test = { version = "1.0.152" }
static_assertions = { version = "1.1.0" }
toml = { version = "0.8" }
unic-ucd-category = { version = "0.9" }
unicode-ident = { version = "1.0.12" }
unicode_names2 = { version = "1.2.2" }
unicode-normalization = { version = "0.1.23" }
walkdir = { version = "2.3.2" }

[workspace.lints.rust]
unsafe_code = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -2 }
char_lit_as_u8 = "allow"
collapsible_else_if = "allow"
collapsible_if = "allow"
implicit_hasher = "allow"
map_unwrap_or = "allow"
match_same_arms = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
too_many_lines = "allow"
needless_raw_string_hashes = "allow"
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"

[profile.release]
lto = "thin"
codegen-units = 16

[profile.release.package.sifr_python_parser]
codegen-units = 1
[profile.release.package.sifr_python_ast]
codegen-units = 1

[profile.dev.package.insta]
opt-level = 3
[profile.dev.package.similar]
opt-level = 3
[profile.dev.package.sifr_python_parser]
opt-level = 1
