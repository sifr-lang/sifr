[package]
name = "sifr_codegen"
version = "0.0.0"
publish = false
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }

[dependencies]
# Wired early for diagnostic registry migration; compiler emission migration uses this dependency.
sifr_diagnostics = { workspace = true }
sifr_ir = { workspace = true }
sifr_stdlib_manifest = { workspace = true }
sifr_structural_identity = { workspace = true }
sifr_type_system = { workspace = true }
ruff_text_size = { workspace = true }
syn = { workspace = true, features = ["printing", "visit-mut"] }
prettyplease = "0.3.0"
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
quote = "1.0.45"
unicode-ident = { workspace = true }
bigdecimal = { workspace = true }
rust_decimal = { workspace = true }

[dev-dependencies]
sifr_lowering = { workspace = true }
sifr_python_parser = { workspace = true }
insta = { workspace = true }
static_assertions = { workspace = true }

[lints]
workspace = true
