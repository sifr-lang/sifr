[package]
name = "sifr_sql_postgresql"
version = "0.0.0"
publish = false
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
build = "build.rs"

# Each native parser version owns a distinct Cargo artifact identity.
# No explicit version feature preserves the default PostgreSQL 18 selection.
[features]
postgresql-13 = []
postgresql-14 = []
postgresql-15 = []
postgresql-16 = []
postgresql-17 = []
postgresql-18 = []

[lib]
crate-type = ["rlib"]

[package.metadata.sifr_sql]
artifact-role = "postgresql-compiler-component"
source-manifest = "component-sources.json"

[dependencies]
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sifr_compiler_component = { workspace = true }
sifr_sql_contract = { workspace = true }

[target.'cfg(target_family = "wasm")'.dependencies]
wit-bindgen = { workspace = true }

[build-dependencies]
cc = { workspace = true, features = ["parallel"] }
serde_json = { workspace = true }

[dev-dependencies]
sifr_compiler_component = { workspace = true, features = ["host"] }
insta = { workspace = true }

[lints]
workspace = true

[package.metadata.sifr-build]
production-inputs = ["src", "build.rs", "component-artifacts.json", "component-sources.json", "components", "wasi_compat"]
