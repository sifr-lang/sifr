[package]
links = "sifr_sql_tool_compiled_identity"
name = "sifr_sql_tool"
version = "0.0.0"
publish = false
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }

[dependencies]
tokio = { workspace = true, features = ["rt", "time", "macros"] }
sifr_ipc = { workspace = true }
sifr_process = { workspace = true }
sifr_sysroot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sifr_sql_contract = { workspace = true }
sifr_sql_runtime = { workspace = true }
tempfile = "3.27.0"

[dev-dependencies]
semver = { workspace = true }

[lints]
workspace = true

[features]
__compiler_fixture = []

[[bin]]
name = "sifr-sql-compiler-fixture"
path = "tests/fixtures/compiler_worker.rs"
required-features = ["__compiler_fixture"]
test = false
bench = false

[build-dependencies]
sifr_identity = { workspace = true, features = ["build"] }
