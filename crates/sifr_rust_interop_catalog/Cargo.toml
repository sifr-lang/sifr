[package]
name = "sifr_rust_interop_catalog"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

# These optional dependencies make the exact certification graph part of the
# workspace lockfile and `cargo fetch --locked` cache without compiling it in
# ordinary development lanes. Row PRs enable only their owning dependencies.
[dependencies]
anyhow = { version = "=1.0.102", default-features = true, optional = true }
arrow = { version = "=58.3.0", default-features = true, optional = true }
axum = { version = "=0.8.9", default-features = true, optional = true }
bindgen = { version = "=0.72.1", default-features = true, optional = true }
blake3 = { version = "=1.8.5", default-features = true, optional = true }
bytemuck = { version = "=1.25.2", default-features = true, optional = true }
bytes = { version = "=1.11.1", default-features = true, optional = true }
candle = { package = "candle-core", version = "=0.11.0", default-features = false, optional = true }
cc = { version = "=1.2.63", default-features = true, optional = true }
clap = { version = "=4.6.1", default-features = true, optional = true }
crc32fast = { version = "=1.5.0", default-features = true, optional = true }
cxx = { version = "=1.0.198", default-features = true, optional = true }
datafusion = { version = "=54.1.0", default-features = true, optional = true }
flate2 = { version = "=1.1.9", default-features = false, features = ["rust_backend"], optional = true }
futures = { version = "=0.3.33", default-features = true, optional = true }
http = { version = "=1.4.2", default-features = true, optional = true }
http-body = { version = "=1.0.1", default-features = true, optional = true }
indexmap = { version = "=2.14.0", default-features = true, optional = true }
memmap2 = { version = "=0.9.11", default-features = true, optional = true }
ndarray = { version = "=0.17.2", default-features = true, optional = true }
notify = { version = "=8.2.0", default-features = true, optional = true }
polars = { version = "=0.54.4", default-features = true, optional = true }
prost-build = { version = "=0.14.4", default-features = true, optional = true }
rayon = { version = "=1.12.0", default-features = true, optional = true }
redis = { version = "=1.4.1", default-features = false, features = ["tokio-comp"], optional = true }
regex = { version = "=1.12.3", default-features = true, optional = true }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "json"], optional = true }
rusqlite = { version = "=0.39.0", default-features = true, features = ["bundled"], optional = true }
serde = { version = "=1.0.228", default-features = true, optional = true }
serde_derive = { version = "=1.0.228", default-features = true, optional = true }
serde_json = { version = "=1.0.149", default-features = true, optional = true }
sha2 = { version = "=0.10.9", default-features = true, optional = true }
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "macros"], optional = true }
thiserror = { version = "=2.0.18", default-features = true, optional = true }
tokio = { version = "=1.52.3", default-features = true, optional = true }
tokio-postgres = { version = "=0.7.18", default-features = false, features = ["runtime"], optional = true }
tokio-tungstenite = { version = "=0.30.0", default-features = false, optional = true }
tower = { version = "=0.5.3", default-features = true, optional = true }
tower-http = { version = "=0.7.0", default-features = true, optional = true }
tracing = { version = "=0.1.44", default-features = true, optional = true }
tracing-subscriber = { version = "=0.3.23", default-features = true, features = ["env-filter"], optional = true }
uuid = { version = "=1.23.1", default-features = true, optional = true }
zerocopy = { version = "=0.8.48", default-features = true, features = ["derive"], optional = true }
zstd = { version = "=0.13.3", default-features = true, optional = true }

[package.metadata.sifr-rust-interop]
schema-version = 1
candle-backend = "cpu-only"
prost-build-generated-output = "deterministic"

[lints]
workspace = true
