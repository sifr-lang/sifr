[package]
links = "sifr_driver_compiled_identity"
name = "sifr_driver"
version = "0.0.0"
publish = false
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }

[dependencies]
num-bigint.workspace = true
sifr_identity.workspace = true
sifr_cache_storage.workspace = true
sifr_compiler_services.workspace = true
# Wired early for diagnostic registry migration; compiler emission migration uses this dependency.
sifr_diagnostics = { workspace = true }
sifr_python_ast = { workspace = true }
sifr_lowering = { workspace = true }
sifr_ir = { workspace = true }
sifr_stdlib_imports = { workspace = true }
sifr_stdlib_manifest = { workspace = true }
sifr_frontend = { workspace = true }
sifr_syntax = { workspace = true }
sifr_codegen = { workspace = true }
sifr_package = { workspace = true }
sifr_compiler_component = { workspace = true }
sifr_sql_contract = { workspace = true }
sifr_sysroot = { workspace = true }
sifr_type_system = { workspace = true }
ruff_text_size = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
libc = { workspace = true }
syn = { workspace = true }
toml = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }
syn = { workspace = true }
toml = { workspace = true }
tempfile = "3.27.0"

[dev-dependencies]
sifr_cache_storage = { workspace = true, features = ["test-support"] }
memchr = { workspace = true }
tempfile = "3.27.0"
wat = { workspace = true }

[lints]
workspace = true

[build-dependencies]
sifr_identity = { workspace = true, features = ["build"] }
