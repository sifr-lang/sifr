[package]
name = "sifr_sql_sqlite"
version = "0.0.0"
publish = false
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }

[lib]
crate-type = ["rlib", "cdylib"]

[package.metadata.sifr_sql]
artifact-role = "sqlite-compiler-component"
grammar = "syntaqlite@0.9.0/sqlite-3.53.2"
artifact-manifest = "component-artifacts.json"
supported-servers = ["3.53.2"]
sqlite-version-number = 3053002
compile-flags = []

[dependencies]
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sifr_compiler_component = { workspace = true }
sifr_sql_contract = { workspace = true }
syntaqlite = { workspace = true, features = ["analysis", "fmt", "pin-cflags", "pin-version", "serde", "sqlite"] }

[target.'cfg(target_family = "wasm")'.dependencies]
wit-bindgen = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
rusqlite = { workspace = true, features = ["bundled"] }

[lints]
workspace = true
