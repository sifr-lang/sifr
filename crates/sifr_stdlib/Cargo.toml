[package]
name = "sifr_stdlib"
version = "0.0.0"
publish = false
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }

[dependencies]
base64 = { workspace = true, optional = true }
bigdecimal = { workspace = true, optional = true }
blake2 = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
encoding_rs = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
h2 = { workspace = true, optional = true }
http = { workspace = true, optional = true }
http-body = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
md5 = { workspace = true, optional = true }
metrics = { workspace = true, optional = true }
num-bigint = { workspace = true, optional = true }
num-traits = { workspace = true, optional = true }
percent-encoding = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
rand_distr = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
rust_decimal = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-pemfile = { workspace = true, optional = true }
rustls-platform-verifier = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha1 = { workspace = true, optional = true }
sha2_0_11 = { workspace = true, optional = true }
sifr_runtime = { path = "../sifr_runtime", default-features = false, optional = true }
tokio = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
tower-service = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
unicode-normalization = { workspace = true, optional = true }
unicode-segmentation = { workspace = true, optional = true }
unicode_names2 = { workspace = true, optional = true }
url = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
zip_8_6 = { workspace = true, optional = true }

[features]
default = []
json = ["dep:serde", "dep:serde_json", "dep:sifr_runtime"]
regex = ["dep:regex", "dep:sifr_runtime"]
uuid = ["dep:uuid"]
hash = ["dep:blake2", "dep:md5", "dep:sha1", "dep:sha2_0_11"]
base64 = ["dep:base64", "dep:sifr_runtime"]
toml = ["dep:toml"]
url = ["dep:percent-encoding", "dep:sifr_runtime", "dep:url"]
gzip = ["dep:flate2"]
# Zip archive support owns the zip leaf and enables gzip for deflate streams.
zipfile = ["dep:zip_8_6", "gzip"]
unicode = [
    "dep:sifr_runtime",
    "dep:unicode-normalization",
    "dep:unicode-segmentation",
    "dep:unicode_names2",
    "sifr_runtime/unicode",
]
i18n = ["dep:sifr_runtime", "sifr_runtime/i18n"]
net = ["dep:sifr_runtime", "sifr_runtime/net"]
tls = [
    "dep:rustls",
    "dep:rustls-pemfile",
    "dep:rustls-platform-verifier",
    "dep:tokio-rustls",
    "net",
    "sifr_runtime/tls",
]
http = [
    "dep:h2",
    "dep:http",
    "dep:http-body",
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-util",
    "dep:tokio",
    "dep:tower-service",
    "tls",
    "sifr_runtime/http",
]
python = ["dep:sifr_runtime", "sifr_runtime/python"]
process = []
fs = []
html = []
calendar = ["dep:sifr_runtime"]
platform = []
math = ["dep:sifr_runtime"]
signals = []
random = ["dep:rand", "dep:rand_distr"]
time = ["dep:chrono"]
encoding = ["dep:encoding_rs"]
runtime-observability = ["dep:metrics", "dep:tracing"]

# Maintenance aliases. Generated Cargo planning must prefer the leaf features
# above so one stdlib module does not enable unrelated capability groups.
text-data = ["json", "base64", "toml", "url", "gzip", "zipfile", "unicode", "i18n"]
network-stack = ["net", "tls", "http"]
numeric = ["dep:bigdecimal", "dep:num-bigint", "dep:num-traits", "dep:rayon", "dep:rust_decimal"]

[lints]
workspace = true
