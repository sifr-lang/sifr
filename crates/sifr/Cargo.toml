[package]
name = "sifr"
version = "0.0.0"
publish = false
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }

[[bin]]
name = "sifr"
path = "src/main.rs"

[dependencies]
# Wired early for diagnostic registry migration; compiler emission migration uses this dependency.
ruff_text_size = { workspace = true }
sifr_diagnostics = { workspace = true }
sifr_driver = { workspace = true }
sifr_format = { workspace = true }
sifr_frontend = { workspace = true }
sifr_lint = { workspace = true }
sifr_lsp = { workspace = true }
sifr_package = { workspace = true }
sifr_python_ast = { workspace = true }
sifr_sysroot = { workspace = true }
sifr_syntax = { workspace = true }
sifr_sql_contract = { workspace = true }
clap = { version = "4.6.6", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
sifr_stdlib_manifest = { workspace = true }
tempfile = "3.27.0"

[lints]
workspace = true
