[package]
links = "sifr_compiler_component_compiled_identity"
name = "sifr_compiler_component"
version = "0.0.0"
publish = false
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }

[features]
default = ["host"]
host = ["dep:wasmtime", "dep:sifr_compiler_component_engine"]

[dependencies]
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sifr_diagnostics = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
wasmtime = { workspace = true, optional = true }
sifr_compiler_component_engine = { workspace = true, optional = true }

[dev-dependencies]
wat = { workspace = true }

[lints]
workspace = true

[build-dependencies]
sifr_identity = { workspace = true, features = ["build"] }
