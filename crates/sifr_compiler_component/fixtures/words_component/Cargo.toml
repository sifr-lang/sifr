[package]
name = "sifr-component-fixture-words"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.98"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
wit-bindgen = "=0.57.1"
wit-component = { version = "=0.254.0", optional = true }

[features]
componentize = ["dep:wit-component"]

[[bin]]
name = "componentize"
path = "src/bin/componentize.rs"
required-features = ["componentize"]

[workspace]
