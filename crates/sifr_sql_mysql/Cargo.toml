[package]
name = "sifr_sql_mysql"
version = "0.0.0"
publish = false
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }

[lib]
crate-type = ["rlib"]

[package.metadata.sifr_sql]
artifact-role = "mysql-compiler-component"
statement-framing = "src/statement_framing.rs"
artifact-manifest = "component-artifacts.json"
supported-servers = ["8.4", "9.7", "26.7"]

[dependencies]
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sifr_compiler_component = { workspace = true }
sifr_sql_contract = { workspace = true }

[target.'cfg(target_family = "wasm")'.dependencies]
wit-bindgen = { workspace = true }

[dev-dependencies]
sifr_compiler_component = { workspace = true, features = ["host"] }
insta = { workspace = true }
mysql_async = { workspace = true, features = ["aws-lc-rs", "minimal-rust", "rustls-tls", "tls12"] }
tokio = { workspace = true, features = ["macros", "net", "rt", "time"] }

[lints]
workspace = true

[package.metadata.sifr-build]
production-inputs = ["src", "component-artifacts.json", "components"]
