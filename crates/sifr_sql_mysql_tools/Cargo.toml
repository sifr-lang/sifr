[package]
name = "sifr_sql_mysql_tools"
version = "0.0.0"
publish = false
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }

[[bin]]
name = "sifr-sql-mysql"
path = "src/main.rs"

[package.metadata.sifr_sql]
artifact-role = "mysql-host-tools"
supported-servers = ["8.4", "9.7", "26.7"]
connection-manifest-version = 1

[dependencies]
mysql_async = { workspace = true, features = ["aws-lc-rs", "minimal-rust", "rustls-tls", "tls12"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sifr_driver = { workspace = true }
sifr_sql_contract = { workspace = true }
sifr_sql_mysql = { workspace = true }
sifr_sql_runtime = { workspace = true }
sifr_sql_tool = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt", "time"] }
url = { workspace = true }

[dev-dependencies]
semver = { workspace = true }
tempfile = "3.27.0"

[lints]
workspace = true
