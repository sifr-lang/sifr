[package]
name = "sifr_runtime"
version = "0.0.0"
publish = false
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }

[dependencies]
bytes = { workspace = true, optional = true }
encoding_rs = { workspace = true }
h2 = { workspace = true, optional = true }
http = { workspace = true, optional = true }
http-body = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
icu_collator = { workspace = true, optional = true }
icu_datetime = { workspace = true, optional = true }
icu_decimal = { workspace = true, optional = true }
icu_locale = { workspace = true, optional = true }
icu_plurals = { workspace = true, optional = true }
num-bigint = { workspace = true }
num-traits = { workspace = true }
rustls = { workspace = true, optional = true }
rustls-pemfile = { workspace = true, optional = true }
rustls-platform-verifier = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
tower-service = { workspace = true, optional = true }
unicode-normalization = { workspace = true, optional = true }
unicode-segmentation = { workspace = true, optional = true }
unicode_names2 = { workspace = true, optional = true }

[dev-dependencies]
rcgen = { workspace = true }

[features]
default = []
i18n = [
    "dep:icu_collator",
    "dep:icu_datetime",
    "dep:icu_decimal",
    "dep:icu_locale",
    "dep:icu_plurals",
]
unicode = ["dep:unicode-normalization", "dep:unicode-segmentation", "dep:unicode_names2"]
net = ["dep:tokio"]
tls = [
    "net",
    "dep:rustls",
    "dep:rustls-pemfile",
    "dep:rustls-platform-verifier",
    "dep:tokio-rustls",
]
http = [
    "tls",
    "dep:bytes",
    "dep:h2",
    "dep:http",
    "dep:http-body",
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-util",
    "dep:tower-service",
]

[lints]
workspace = true
