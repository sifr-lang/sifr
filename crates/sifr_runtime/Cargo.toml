[package]
name = "sifr_runtime"
version = "0.0.0"
publish = false
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }

[dependencies]
encoding_rs = { workspace = true }
icu_collator = { workspace = true, optional = true }
icu_datetime = { workspace = true, optional = true }
icu_decimal = { workspace = true, optional = true }
icu_locale = { workspace = true, optional = true }
icu_plurals = { workspace = true, optional = true }
num-bigint = { workspace = true }
num-traits = { workspace = true }
tokio = { workspace = true, optional = true }
unicode-normalization = { workspace = true, optional = true }
unicode-segmentation = { workspace = true, optional = true }
unicode_names2 = { workspace = true, optional = true }

[features]
default = []
i18n = [
    "dep:icu_collator",
    "dep:icu_datetime",
    "dep:icu_decimal",
    "dep:icu_locale",
    "dep:icu_plurals",
]
unicode = ["dep:unicode-normalization", "dep:unicode-segmentation", "dep:unicode_names2"]
net = ["dep:tokio"]

[lints]
workspace = true
