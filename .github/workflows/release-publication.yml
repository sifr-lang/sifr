name: release-publication
on:
  workflow_dispatch:
    inputs:
      governance_mode:
        required: true
        type: choice
        options:
          - drill-publication
          - drill-rollback
          - drill-first-ga
          - ga-activation
          - normal
          - rollback
          - incident-roll-forward
      evidence_commit:
        default: ""
      candidate_path:
        default: ""
      expected_plan_sha256:
        default: ""
      incident_commit:
        default: ""
      incident_path:
        default: ""
      expected_request_sha256:
        default: ""
      publication_mode:
        required: false
        default: initial
        type: choice
        options:
          - initial
          - resume
  workflow_call:
    inputs:
      channel:
        default: ""
        type: string
      version:
        default: ""
        type: string
      base_ref:
        default: ""
        type: string
      source_commit:
        default: ""
        type: string
      site_base_commit:
        default: ""
        type: string
      governance_mode:
        default: preview
        type: string
      bootstrap_alpha_version:
        default: ""
        type: string
      evidence_commit:
        default: ""
        type: string
      candidate_path:
        default: ""
        type: string
      expected_plan_sha256:
        default: ""
        type: string
      incident_commit:
        default: ""
        type: string
      incident_path:
        default: ""
        type: string
      expected_request_sha256:
        default: ""
        type: string
      publication_mode:
        default: ""
        type: string
    secrets:
      SIFR_WEBSITE_ACTIONS_TOKEN:
        required: true
      VSCE_PAT:
        required: false
permissions:
  actions: read
  contents: read
concurrency:
  group: ${{ startsWith(inputs.governance_mode, 'drill-') && 'sifr-release-drill' || 'sifr-release-index' }}
  cancel-in-progress: false
jobs:
  prepare:
    if: ${{ !startsWith(inputs.governance_mode, 'drill-') }}
    uses: ./.github/workflows/release-publication-prepare.yml
    permissions:
      actions: read
      contents: read
    with:
      channel: ${{ inputs.channel }}
      version: ${{ inputs.version }}
      source_commit: ${{ inputs.source_commit }}
      governance_mode: ${{ inputs.governance_mode }}
      bootstrap_alpha_version: ${{ inputs.bootstrap_alpha_version }}
      evidence_commit: ${{ inputs.evidence_commit }}
      candidate_path: ${{ inputs.candidate_path }}
      expected_plan_sha256: ${{ inputs.expected_plan_sha256 }}
      incident_commit: ${{ inputs.incident_commit }}
      incident_path: ${{ inputs.incident_path }}
      expected_request_sha256: ${{ inputs.expected_request_sha256 }}
      publication_mode: ${{ inputs.publication_mode }}
  publish:
    name: mutate governed release
    if: ${{ !startsWith(inputs.governance_mode, 'drill-') }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: ${{ inputs.governance_mode == 'preview' && 'preview-release' || 'stable-release' }}
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      CHANNEL: ${{ inputs.channel }}
      VERSION: ${{ (inputs.governance_mode == 'ga-activation' || inputs.governance_mode == 'normal' || inputs.governance_mode == 'rollback' || inputs.governance_mode == 'incident-roll-forward') && needs.prepare.outputs.version || inputs.version }}
      BASE_REF: ${{ inputs.base_ref }}
      SOURCE_COMMIT: ${{ (inputs.governance_mode == 'ga-activation' || inputs.governance_mode == 'normal' || inputs.governance_mode == 'incident-roll-forward') && needs.prepare.outputs.source_commit || inputs.source_commit }}
      SITE_BASE_COMMIT: ${{ (inputs.governance_mode == 'ga-activation' || inputs.governance_mode == 'normal' || inputs.governance_mode == 'rollback' || inputs.governance_mode == 'incident-roll-forward') && needs.prepare.outputs.site_base_commit || inputs.site_base_commit }}
      GOVERNANCE_MODE: ${{ inputs.governance_mode }}
      STABLE_MUTATION_OPERATION: ${{ contains(fromJSON('["ga-activation","normal","rollback","incident-roll-forward"]'), inputs.governance_mode) }}
      STABLE_CANDIDATE_OPERATION: ${{ contains(fromJSON('["ga-activation","normal","incident-roll-forward"]'), inputs.governance_mode) }}
      STABLE_PUBLICATION_OPERATION: ${{ contains(fromJSON('["ga-activation","normal"]'), inputs.governance_mode) }}
      INCIDENT_OPERATION: ${{ contains(fromJSON('["rollback","incident-roll-forward"]'), inputs.governance_mode) }}
      BOOTSTRAP_ALPHA_VERSION: ${{ inputs.bootstrap_alpha_version }}
      EVIDENCE_COMMIT: ${{ inputs.evidence_commit }}
      CANDIDATE_PATH: ${{ inputs.candidate_path }}
      EXPECTED_PLAN_SHA256: ${{ inputs.expected_plan_sha256 }}
      INCIDENT_COMMIT: ${{ inputs.incident_commit }}
      INCIDENT_PATH: ${{ inputs.incident_path }}
      EXPECTED_REQUEST_SHA256: ${{ inputs.expected_request_sha256 }}
      PUBLICATION_MODE: ${{ inputs.publication_mode }}
      PREPARE_SUMMARY_SHA256: ${{ needs.prepare.outputs.summary_sha256 }}
      LEGACY_INDEX_SHA256: 71b3243925670f56dc510b8f45b6614a622f58097a0fea9492f61d20dc4bf9ef
      PUBLICATION_ATTEMPT: ${{ github.run_id }}-${{ github.run_attempt }}
      SITE_REPOSITORY: sifr-lang/sifr-website
      SITE_WORKFLOW: release-site.yml
      SITE_WORKFLOW_REF: sifr-release-site-stable-facts
      SITE_WORKFLOW_RULESET_ID: "19899766"
      SITE_WORKFLOW_RULESET_UPDATED_AT: "2026-07-28T13:22:41.496Z"
      SITE_WORKFLOW_SHA256: a9360c82395f6e9d9822f201e56cc0f2eabab1bacda01c31e4e9f22d0202b3af
      SINGLE_MAINTAINER_APPROVAL_WAIVER: plans/releases/single-maintainer-approval-waiver.json
      SINGLE_MAINTAINER_APPROVAL_WAIVER_SHA256: b9630cc060ca281946da76a9cb9bc67564759c8d5446b6a33157a7d138080008
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: env.STABLE_MUTATION_OPERATION != 'true'
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: env.STABLE_MUTATION_OPERATION == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: env.STABLE_CANDIDATE_OPERATION == 'true'
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          fetch-depth: 0
          path: stable-source
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: env.STABLE_CANDIDATE_OPERATION == 'true'
        with:
          ref: ${{ inputs.evidence_commit }}
          fetch-depth: 0
          path: stable-evidence
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: env.INCIDENT_OPERATION == 'true'
        with:
          ref: ${{ inputs.incident_commit }}
          fetch-depth: 0
          path: incident-evidence
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: env.STABLE_MUTATION_OPERATION != 'true'
        with:
          pattern: sifr-${{ inputs.version }}-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.prepare.outputs.summary_artifact_name }}
          path: protected-prepare
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: env.STABLE_CANDIDATE_OPERATION == 'true'
        with:
          node-version-file: stable-source/editor_integrations/vscode/.node-version
          cache: npm
          cache-dependency-path: stable-source/editor_integrations/vscode/package-lock.json
      - name: Provision pinned Marketplace publisher
        if: env.STABLE_CANDIDATE_OPERATION == 'true'
        shell: bash
        env:
          GH_TOKEN: ""
        run: npm ci --ignore-scripts --include=dev --prefix stable-source/editor_integrations/vscode
      - name: Revalidate prepare summary and protected approver
        if: env.STABLE_MUTATION_OPERATION != 'true'
        id: approval
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum protected-prepare/summary.json | awk '{print $1}')" = \
            "${PREPARE_SUMMARY_SHA256}" || {
              echo "::error::protected job received different prepare-summary bytes"
              exit 2
            }
          jq -e \
            --arg mode "${GOVERNANCE_MODE}" \
            --arg channel "${CHANNEL}" \
            --arg version "${VERSION}" \
            --arg source "${SOURCE_COMMIT}" \
            --arg alpha "${BOOTSTRAP_ALPHA_VERSION}" \
            '.schema_version == 2
             and .operation == $mode
             and .channel == $channel
             and .version == $version
             and .source_commit == $source
             and .bootstrap_alpha_version == $alpha
             and (
               if $mode == "bootstrap-index"
               then (.bootstrap_alpha_evidence_sha256 | test("^[0-9a-f]{64}$"))
               else .bootstrap_alpha_evidence_sha256 == ""
               end
             )
             and (.current_index_sha256 | test("^[0-9a-f]{64}$"))
             and (.assets | type == "object")' \
            protected-prepare/summary.json >/dev/null || {
            echo "::error::prepare summary outputs do not match protected job inputs"
            exit 2
          }
          if [[ "${GOVERNANCE_MODE}" == bootstrap-* ]]; then
            waiver_sha256="$(
              sha256sum "${SINGLE_MAINTAINER_APPROVAL_WAIVER}" | awk '{print $1}'
            )"
            test "${waiver_sha256}" = "${SINGLE_MAINTAINER_APPROVAL_WAIVER_SHA256}" || {
              echo "::error::single-maintainer approval waiver digest drifted"
              exit 2
            }
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/approvals" \
              >protected-prepare/approvals.json
            approval_json="$(
              scripts/distribution/release_governance.py resolve-publication-approvers \
                --approvals protected-prepare/approvals.json \
                --initiator "${GITHUB_TRIGGERING_ACTOR}" \
                --environment stable-release \
                --repository "${GITHUB_REPOSITORY}" \
                --operation "${GOVERNANCE_MODE}" \
                --single-maintainer-waiver "${SINGLE_MAINTAINER_APPROVAL_WAIVER}" \
                --expected-waiver-sha256 "${SINGLE_MAINTAINER_APPROVAL_WAIVER_SHA256}" \
                --include-policy
            )"
            {
              echo "approvers_json=$(jq -c '.approvers' <<<"${approval_json}")"
              echo "approval_mode=$(jq -r '.approval_policy.mode' <<<"${approval_json}")"
              echo "approval_waiver_sha256=$(jq -r '.approval_policy.waiver_sha256' <<<"${approval_json}")"
            } >>"${GITHUB_OUTPUT}"
          else
            {
              echo 'approvers_json=[]'
              echo 'approval_mode=distinct-reviewer'
              echo 'approval_waiver_sha256=none'
            } >>"${GITHUB_OUTPUT}"
          fi
      - name: Validate protected publication inputs
        if: env.STABLE_MUTATION_OPERATION != 'true'
        shell: bash
        env:
          SITE_TOKEN: ${{ secrets.SIFR_WEBSITE_ACTIONS_TOKEN }}
        run: |
          set -euo pipefail
          scripts/distribution/validate_preview_publication_inputs.sh \
            --channel "${CHANNEL}" --operation "${GOVERNANCE_MODE}" \
            --version "${VERSION}" \
            --bootstrap-alpha-version "${BOOTSTRAP_ALPHA_VERSION}" \
            --source-commit "${SOURCE_COMMIT}" \
            --repository "${GITHUB_REPOSITORY}" \
            --site-repository "${SITE_REPOSITORY}" \
            --site-commit "${SITE_BASE_COMMIT}" \
            --site-workflow "${SITE_WORKFLOW}" \
            --site-workflow-ref "${SITE_WORKFLOW_REF}" \
            --site-ruleset-id "${SITE_WORKFLOW_RULESET_ID}" \
            --site-ruleset-updated-at "${SITE_WORKFLOW_RULESET_UPDATED_AT}" \
            --site-workflow-sha256 "${SITE_WORKFLOW_SHA256}"
      - name: Verify complete immutable asset set
        if: env.STABLE_MUTATION_OPERATION != 'true'
        shell: bash
        run: |
          set -euo pipefail
          scripts/distribution/verify_release_publication_assets.sh \
            --version "${VERSION}" \
            --assets release-assets \
            --prepare-summary protected-prepare/summary.json
      - name: Fetch governed index and allocate max generation
        if: env.STABLE_MUTATION_OPERATION != 'true'
        id: index
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publication history dispatchers
          gh release download channels \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern channels.json \
            --dir publication
          mv publication/channels.json publication/current-channels.json
          current_sha256="$(sha256sum publication/current-channels.json | awk '{print $1}')"
          test "$(
            jq -r '.current_index_sha256' protected-prepare/summary.json
          )" = "${current_sha256}" || {
            echo "::error::governed index changed after read-only prepare"
            exit 2
          }
          if [[ "${GOVERNANCE_MODE}" == bootstrap-* ]]; then
            test "${current_sha256}" = "${LEGACY_INDEX_SHA256}" &&
              test "$(wc -c <publication/current-channels.json | tr -d '[:space:]')" = "105" || {
                echo "::error::one-time bootstrap source is not the exact opaque v1 asset"
                exit 2
              }
            if [[ "${GOVERNANCE_MODE}" == "bootstrap-index" ]]; then
              stage_evidence="publication/schema-v2-bootstrap-alpha-${BOOTSTRAP_ALPHA_VERSION}.json"
              gh release download channels \
                --repo "${GITHUB_REPOSITORY}" \
                --pattern "$(basename "${stage_evidence}")" \
                --dir publication
              test "$(sha256sum "${stage_evidence}" | awk '{print $1}')" = "$(
                jq -r '.bootstrap_alpha_evidence_sha256' \
                  protected-prepare/summary.json
              )" || {
                echo "::error::staged alpha evidence changed after read-only prepare"
                exit 2
              }
              scripts/distribution/fetch_schema_bootstrap_alpha.sh \
                --repository "${GITHUB_REPOSITORY}" \
                --version "${BOOTSTRAP_ALPHA_VERSION}" \
                --evidence "${stage_evidence}" \
                --assets publication/bootstrap-alpha-assets \
                --record publication/alpha-release.json
            fi
            {
              echo "current_generation=0"
              echo "current_sha256=${current_sha256}"
              echo "proposed_generation=1"
            } >>"${GITHUB_OUTPUT}"
            exit 0
          fi
          scripts/distribution/release_governance.py validate \
            --kind release-index \
            --input publication/current-channels.json \
            --require-canonical
          current_generation="$(
            python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["generation"])' \
              publication/current-channels.json
          )"
          max_generation="${current_generation}"
          while IFS= read -r snapshot; do
            [[ -n "${snapshot}" ]] || continue
            gh release download channels \
              --repo "${GITHUB_REPOSITORY}" \
              --pattern "${snapshot}" \
              --dir history
            scripts/distribution/release_governance.py validate \
              --kind release-index \
              --input "history/${snapshot}" \
              --require-canonical
            snapshot_generation="${snapshot#channels-generation-}"
            snapshot_generation="${snapshot_generation%.json}"
            payload_generation="$(
              python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["generation"])' \
                "history/${snapshot}"
            )"
            test "${snapshot_generation}" = "${payload_generation}" || {
              echo "::error::snapshot name and payload generation disagree: ${snapshot}"
              exit 2
            }
            if (( payload_generation > max_generation )); then
              max_generation="${payload_generation}"
            fi
          done < <(
            gh release view channels \
              --repo "${GITHUB_REPOSITORY}" \
              --json assets \
              --jq '.assets[].name | select(test("^channels-generation-[1-9][0-9]*[.]json$"))'
          )
          proposed_generation="$((max_generation + 1))"
          {
            echo "current_generation=${current_generation}"
            echo "current_sha256=${current_sha256}"
            echo "proposed_generation=${proposed_generation}"
          } >>"${GITHUB_OUTPUT}"
      - name: Build exact release record, index, dispatchers, and plan
        if: env.STABLE_MUTATION_OPERATION != 'true'
        id: proposal
        shell: bash
        env:
          CURRENT_GENERATION: ${{ steps.index.outputs.current_generation }}
          CURRENT_SHA256: ${{ steps.index.outputs.current_sha256 }}
          PROPOSED_GENERATION: ${{ steps.index.outputs.proposed_generation }}
        run: |
          set -euo pipefail
          scripts/distribution/release_governance.py build-release-record \
            --version "${VERSION}" \
            --channel "${CHANNEL}" \
            --source-commit "${SOURCE_COMMIT}" \
            --installer "release-assets/sifr-installer-${VERSION}" \
            --artifact-dir release-assets \
            --out publication/new-release.json
          release_record_sha256="$(
            sha256sum publication/new-release.json | awk '{print $1}'
          )"
          echo "release_record_sha256=${release_record_sha256}" >>"${GITHUB_OUTPUT}"
          if [[ "${GOVERNANCE_MODE}" == "bootstrap-alpha" ]]; then
            jq -cnS \
              --arg version "${VERSION}" \
              --arg source "${SOURCE_COMMIT}" \
              --arg current "${CURRENT_SHA256}" \
              --arg attempt "${PUBLICATION_ATTEMPT}" \
              '{
                schema_version: 2,
                operation: "schema-epoch-bootstrap-alpha-assets",
                version: $version,
                source_commit: $source,
                current_index_sha256: $current,
                publication_attempt: $attempt
              }' >publication/publication-plan.json
            echo "release_plan_sha256=$(
              sha256sum publication/publication-plan.json | awk '{print $1}'
            )" >>"${GITHUB_OUTPUT}"
            exit 0
          fi
          if [[ "${GOVERNANCE_MODE}" == "bootstrap-index" ]]; then
            scripts/distribution/release_governance.py generate-schema-bootstrap-index \
              --current publication/current-channels.json \
              --alpha-release publication/alpha-release.json \
              --beta-release publication/new-release.json \
              --out publication/channels.json
          else
            scripts/distribution/release_governance.py update-preview-index \
              --current publication/current-channels.json \
              --out publication/channels.json \
              --channel "${CHANNEL}" \
              --release publication/new-release.json \
              --expected-generation "${CURRENT_GENERATION}" \
              --expected-sha256 "${CURRENT_SHA256}" \
              --proposed-generation "${PROPOSED_GENERATION}"
          fi
          ga_status="$(
            python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["ga_status"])' \
              publication/channels.json
          )"
          case "${ga_status}" in
            preview) site_default_channel="beta" ;;
            active) site_default_channel="stable" ;;
            *) echo "::error::unsupported governed ga_status: ${ga_status}"; exit 2 ;;
          esac
          scripts/distribution/generate_dispatchers.sh \
            --install-root dispatchers \
            --default-channel "${site_default_channel}"
          jq -cnS \
            --arg mode "${GOVERNANCE_MODE}" \
            --arg channel "${CHANNEL}" \
            --arg version "${VERSION}" \
            --arg source "${SOURCE_COMMIT}" \
            --arg site "${SITE_BASE_COMMIT}" \
            --arg current_sha "${CURRENT_SHA256}" \
            --argjson current_generation "${CURRENT_GENERATION}" \
            --argjson proposed_generation "${PROPOSED_GENERATION}" \
            --arg attempt "${PUBLICATION_ATTEMPT}" \
            --arg site_default "${site_default_channel}" \
            --arg alpha "${BOOTSTRAP_ALPHA_VERSION}" \
            '{
              schema_version: 2,
              operation: (
                if $mode == "bootstrap-index"
                then "schema-epoch-bootstrap"
                else "preview-publication"
                end
              ),
              channel: $channel,
              version: $version,
              source_commit: $source,
              site_base_commit: $site,
              current_index: {
                generation: $current_generation,
                sha256: $current_sha
              },
              proposed_generation: $proposed_generation,
              publication_attempt: $attempt,
              site_default_channel: $site_default
            }
            + if $mode == "bootstrap-index"
              then {bootstrap_alpha_version: $alpha}
              else {}
              end' >publication/publication-plan.json
          release_plan_sha256="$(
            sha256sum publication/publication-plan.json | awk '{print $1}'
          )"
          release_index_sha256="$(sha256sum publication/channels.json | awk '{print $1}')"
          for dispatcher in index stable alpha beta; do
            digest="$(sha256sum "dispatchers/${dispatcher}" | awk '{print $1}')"
            echo "dispatcher_${dispatcher}_sha256=${digest}" >>"${GITHUB_OUTPUT}"
          done
          {
            echo "release_plan_sha256=${release_plan_sha256}"
            echo "release_index_sha256=${release_index_sha256}"
            echo "site_default_channel=${site_default_channel}"
          } >>"${GITHUB_OUTPUT}"
      - name: Publish write-once version release and verify assets
        if: env.STABLE_MUTATION_OPERATION != 'true'
        shell: bash
        run: |
          set -euo pipefail
          notes_file="$(mktemp)"
          {
            echo "# Sifr ${VERSION}"
            echo
            echo "Preview channel: ${CHANNEL}"
            echo "Base ref: ${BASE_REF}"
            echo "Source commit: ${SOURCE_COMMIT}"
            echo
            echo "This is a public preview release. Stable publication is unavailable here."
          } >"${notes_file}"
          gh release create "${VERSION}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${SOURCE_COMMIT}" \
            --prerelease \
            --latest=false \
            --title "Sifr ${VERSION}" \
            --notes-file "${notes_file}"
          published_tag_sha="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${VERSION}" \
              --jq '.object.sha'
          )"
          if [[ "${published_tag_sha}" != "${SOURCE_COMMIT}" ]]; then
            echo "::error::published version tag does not resolve to source_commit"
            exit 2
          fi
          gh release view "${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json assets >publication/version-release.json
          scripts/distribution/verify_release_installer_asset.py \
            publication/version-release.json \
            "sifr-installer-${VERSION}"
          mkdir publication/published-assets
          gh release download "${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir publication/published-assets
          while IFS= read -r local_asset; do
            name="$(basename "${local_asset}")"
            published_asset="publication/published-assets/${name}"
            test -f "${published_asset}" || {
              echo "::error::published release omitted ${name}"
              exit 2
            }
            cmp "${local_asset}" "${published_asset}" || {
              echo "::error::published release bytes differ for ${name}"
              exit 2
            }
          done < <(find release-assets -mindepth 1 -maxdepth 1 -type f | LC_ALL=C sort)
      - name: Retain protected alpha bootstrap evidence
        if: inputs.governance_mode == 'bootstrap-alpha'
        shell: bash
        env:
          APPROVERS_JSON: ${{ steps.approval.outputs.approvers_json }}
          APPROVAL_MODE: ${{ steps.approval.outputs.approval_mode }}
          APPROVAL_WAIVER_SHA256: ${{ steps.approval.outputs.approval_waiver_sha256 }}
        run: |
          set -euo pipefail
          evidence="publication/schema-v2-bootstrap-alpha-${VERSION}.json"
          scripts/distribution/materialize_schema_bootstrap_evidence.py \
            --stage alpha-assets \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --initiator "${GITHUB_TRIGGERING_ACTOR}" \
            --approval-mode "${APPROVAL_MODE}" \
            --approval-waiver-sha256 "${APPROVAL_WAIVER_SHA256}" \
            --approvers-json "${APPROVERS_JSON}" \
            --prepare-summary protected-prepare/summary.json \
            --legacy-index publication/current-channels.json \
            --alpha-version "${VERSION}" \
            --alpha-source-commit "${SOURCE_COMMIT}" \
            --alpha-record publication/new-release.json \
            --alpha-assets publication/published-assets \
            --out "${evidence}"
          gh release upload channels "${evidence}" --repo "${GITHUB_REPOSITORY}"
          verify_dir="$(mktemp -d)"
          gh release download channels \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "$(basename "${evidence}")" \
            --dir "${verify_dir}"
          cmp "${evidence}" "${verify_dir}/$(basename "${evidence}")" || {
            echo "::error::protected alpha bootstrap evidence drifted after upload"
            exit 2
          }
      - name: Revalidate lease and publish write-once generation snapshot
        if: ${{ inputs.governance_mode != 'bootstrap-alpha' && env.STABLE_MUTATION_OPERATION != 'true' }}
        shell: bash
        env:
          EXPECTED_GENERATION: ${{ steps.index.outputs.current_generation }}
          EXPECTED_SHA256: ${{ steps.index.outputs.current_sha256 }}
          PROPOSED_GENERATION: ${{ steps.index.outputs.proposed_generation }}
        run: |
          set -euo pipefail
          live_dir="$(mktemp -d)"
          gh release download channels \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern channels.json \
            --dir "${live_dir}"
          live_index="${live_dir}/channels.json"
          live_sha256="$(sha256sum "${live_index}" | awk '{print $1}')"
          if [[ "${GOVERNANCE_MODE}" == "bootstrap-index" ]]; then
            test "${live_sha256}" = "${LEGACY_INDEX_SHA256}" &&
              test "$(wc -c <"${live_index}" | tr -d '[:space:]')" = "105" || {
                echo "::error::opaque bootstrap lease changed before reservation"
                exit 2
              }
            live_generation=0
          else
            scripts/distribution/release_governance.py validate \
              --kind release-index \
              --input "${live_index}" \
              --require-canonical
            live_generation="$(
              python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["generation"])' \
                "${live_index}"
            )"
          fi
          if [[ "${live_generation}" != "${EXPECTED_GENERATION}" ||
                "${live_sha256}" != "${EXPECTED_SHA256}" ]]; then
            echo "::error::release index changed after proposal generation"
            exit 2
          fi
          snapshot="publication/channels-generation-${PROPOSED_GENERATION}.json"
          cp publication/channels.json "${snapshot}"
          snapshot_names="$(
            gh release view channels \
              --repo "${GITHUB_REPOSITORY}" \
              --json assets \
              --jq '.assets[].name'
          )"
          if grep -Fxq "$(basename "${snapshot}")" <<<"${snapshot_names}"; then
            echo "::error::generation snapshot already exists"
            exit 2
          fi
          gh release upload channels "${snapshot}" --repo "${GITHUB_REPOSITORY}"
      - name: Replace only canonical channels.json
        if: ${{ inputs.governance_mode != 'bootstrap-alpha' && env.STABLE_MUTATION_OPERATION != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload channels publication/channels.json \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
          activated_dir="$(mktemp -d)"
          gh release download channels \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern channels.json \
            --dir "${activated_dir}"
          activated="${activated_dir}/channels.json"
          test "$(sha256sum "${activated}" | awk '{print $1}')" = \
            "${{ steps.proposal.outputs.release_index_sha256 }}" || {
              echo "::error::activated index digest does not match the proposed bytes"
              exit 2
            }
      - name: Build correlated site publication facts
        if: ${{ inputs.governance_mode != 'bootstrap-alpha' && env.STABLE_MUTATION_OPERATION != 'true' }}
        id: site
        shell: bash
        env:
          RELEASE_PLAN_SHA256: ${{ steps.proposal.outputs.release_plan_sha256 }}
          RELEASE_INDEX_SHA256: ${{ steps.proposal.outputs.release_index_sha256 }}
          PROPOSED_GENERATION: ${{ steps.index.outputs.proposed_generation }}
          DISPATCHER_INDEX_SHA256: ${{ steps.proposal.outputs.dispatcher_index_sha256 }}
          DISPATCHER_STABLE_SHA256: ${{ steps.proposal.outputs.dispatcher_stable_sha256 }}
          DISPATCHER_ALPHA_SHA256: ${{ steps.proposal.outputs.dispatcher_alpha_sha256 }}
          DISPATCHER_BETA_SHA256: ${{ steps.proposal.outputs.dispatcher_beta_sha256 }}
          SITE_DEFAULT_CHANNEL: ${{ steps.proposal.outputs.site_default_channel }}
        run: |
          set -euo pipefail
          scripts/distribution/generate_site_publication_facts.py \
            --out publication/site-publication-facts.json \
            --source-commit "${SOURCE_COMMIT}" \
            --site-base-commit "${SITE_BASE_COMMIT}" \
            --release-plan-sha256 "${RELEASE_PLAN_SHA256}" \
            --publication-attempt "${PUBLICATION_ATTEMPT}" \
            --release-index-generation "${PROPOSED_GENERATION}" \
            --release-index-sha256 "${RELEASE_INDEX_SHA256}" \
            --dispatcher-default-channel "${SITE_DEFAULT_CHANNEL}" \
            --dispatcher-index-sha256 "${DISPATCHER_INDEX_SHA256}" \
            --dispatcher-stable-sha256 "${DISPATCHER_STABLE_SHA256}" \
            --dispatcher-alpha-sha256 "${DISPATCHER_ALPHA_SHA256}" \
            --dispatcher-beta-sha256 "${DISPATCHER_BETA_SHA256}"
          scripts/distribution/release_governance.py validate \
            --kind site-publication-facts \
            --input publication/site-publication-facts.json \
            --require-canonical
          echo "publication_facts_sha256=$(
            sha256sum publication/site-publication-facts.json | awk '{print $1}'
          )" >>"${GITHUB_OUTPUT}"
          stable_site_facts_sha256=none
          if [[ "${SITE_DEFAULT_CHANNEL}" == "stable" ]]; then
            scripts/distribution/release_governance.py generate-site-facts \
              --release-index publication/channels.json \
              --source-plan-sha256 "${RELEASE_PLAN_SHA256}" \
              --release-index-sha256 "${RELEASE_INDEX_SHA256}" \
              --dispatcher "index=${DISPATCHER_INDEX_SHA256}" \
              --dispatcher "stable=${DISPATCHER_STABLE_SHA256}" \
              --dispatcher "alpha=${DISPATCHER_ALPHA_SHA256}" \
              --dispatcher "beta=${DISPATCHER_BETA_SHA256}" \
              --out publication/stable-site-release-facts.json
            stable_site_facts_sha256="$(
              sha256sum publication/stable-site-release-facts.json |
                awk '{print $1}'
            )"
          fi
          echo "stable_site_facts_sha256=${stable_site_facts_sha256}" \
            >>"${GITHUB_OUTPUT}"
      - name: Dispatch and await exact site workflow
        if: ${{ inputs.governance_mode != 'bootstrap-alpha' && env.STABLE_MUTATION_OPERATION != 'true' }}
        shell: bash
        env:
          SITE_TOKEN: ${{ secrets.SIFR_WEBSITE_ACTIONS_TOKEN }}
          RELEASE_PLAN_SHA256: ${{ steps.proposal.outputs.release_plan_sha256 }}
          RELEASE_INDEX_SHA256: ${{ steps.proposal.outputs.release_index_sha256 }}
          PROPOSED_GENERATION: ${{ steps.index.outputs.proposed_generation }}
          DISPATCHER_INDEX_SHA256: ${{ steps.proposal.outputs.dispatcher_index_sha256 }}
          DISPATCHER_STABLE_SHA256: ${{ steps.proposal.outputs.dispatcher_stable_sha256 }}
          DISPATCHER_ALPHA_SHA256: ${{ steps.proposal.outputs.dispatcher_alpha_sha256 }}
          DISPATCHER_BETA_SHA256: ${{ steps.proposal.outputs.dispatcher_beta_sha256 }}
          PUBLICATION_FACTS_SHA256: ${{ steps.site.outputs.publication_facts_sha256 }}
          STABLE_SITE_FACTS_SHA256: ${{ steps.site.outputs.stable_site_facts_sha256 }}
          SITE_DEFAULT_CHANNEL: ${{ steps.proposal.outputs.site_default_channel }}
        run: |
          set -euo pipefail
          scripts/distribution/dispatch_stable_site_publication.sh \
            --repository "${SITE_REPOSITORY}" --workflow "${SITE_WORKFLOW}" \
            --workflow-ref "${SITE_WORKFLOW_REF}" \
            --ruleset-id "${SITE_WORKFLOW_RULESET_ID}" \
            --ruleset-updated-at "${SITE_WORKFLOW_RULESET_UPDATED_AT}" \
            --workflow-sha256 "${SITE_WORKFLOW_SHA256}" \
            --source-commit "${SOURCE_COMMIT}" --site-commit "${SITE_BASE_COMMIT}" \
            --release-plan-sha256 "${RELEASE_PLAN_SHA256}" \
            --publication-attempt "${PUBLICATION_ATTEMPT}" \
            --generation "${PROPOSED_GENERATION}" \
            --index-sha256 "${RELEASE_INDEX_SHA256}" \
            --default-channel "${SITE_DEFAULT_CHANNEL}" \
            --dispatcher-index-sha256 "${DISPATCHER_INDEX_SHA256}" \
            --dispatcher-stable-sha256 "${DISPATCHER_STABLE_SHA256}" \
            --dispatcher-alpha-sha256 "${DISPATCHER_ALPHA_SHA256}" \
            --dispatcher-beta-sha256 "${DISPATCHER_BETA_SHA256}" \
            --publication-facts-sha256 "${PUBLICATION_FACTS_SHA256}" \
            --stable-site-facts-sha256 "${STABLE_SITE_FACTS_SHA256}" \
            --result-out publication/site-run.json
      - name: Run protected public schema-bootstrap smoke
        if: inputs.governance_mode == 'bootstrap-index'
        shell: bash
        run: |
          set -euo pipefail
          scripts/distribution/run_schema_bootstrap_public_smoke.sh \
            --repository "${GITHUB_REPOSITORY}" \
            --version "${VERSION}" \
            --index publication/channels.json \
            --dispatchers dispatchers \
            --out publication/bootstrap-smoke
      - name: Retain final protected schema-bootstrap evidence
        if: inputs.governance_mode == 'bootstrap-index'
        shell: bash
        env:
          APPROVERS_JSON: ${{ steps.approval.outputs.approvers_json }}
          APPROVAL_MODE: ${{ steps.approval.outputs.approval_mode }}
          APPROVAL_WAIVER_SHA256: ${{ steps.approval.outputs.approval_waiver_sha256 }}
        run: |
          set -euo pipefail
          alpha_source="$(
            jq -r '.alpha.source_commit' \
              "publication/schema-v2-bootstrap-alpha-${BOOTSTRAP_ALPHA_VERSION}.json"
          )"
          evidence="publication/schema-v2-bootstrap-generation-1.json"
          scripts/distribution/materialize_schema_bootstrap_evidence.py \
            --stage preview-index \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --initiator "${GITHUB_TRIGGERING_ACTOR}" \
            --approval-mode "${APPROVAL_MODE}" \
            --approval-waiver-sha256 "${APPROVAL_WAIVER_SHA256}" \
            --approvers-json "${APPROVERS_JSON}" \
            --prepare-summary protected-prepare/summary.json \
            --legacy-index publication/current-channels.json \
            --alpha-version "${BOOTSTRAP_ALPHA_VERSION}" \
            --alpha-source-commit "${alpha_source}" \
            --alpha-record publication/alpha-release.json \
            --alpha-assets publication/bootstrap-alpha-assets \
            --beta-version "${VERSION}" \
            --beta-source-commit "${SOURCE_COMMIT}" \
            --beta-record publication/new-release.json \
            --beta-assets publication/published-assets \
            --index publication/channels.json \
            --smoke-dir publication/bootstrap-smoke \
            --alpha-evidence \
              "publication/schema-v2-bootstrap-alpha-${BOOTSTRAP_ALPHA_VERSION}.json" \
            --out "${evidence}"
          gh release upload channels "${evidence}" --repo "${GITHUB_REPOSITORY}"
          verify_dir="$(mktemp -d)"
          gh release download channels \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "$(basename "${evidence}")" \
            --dir "${verify_dir}"
          cmp "${evidence}" "${verify_dir}/$(basename "${evidence}")" || {
            echo "::error::final schema-bootstrap evidence drifted after upload"
            exit 2
          }
      - name: Run exact protected stable publication
        if: env.STABLE_PUBLICATION_OPERATION == 'true'
        shell: bash
        env:
          SITE_TOKEN: ${{ secrets.SIFR_WEBSITE_ACTIONS_TOKEN }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VSCE_BIN: ${{ github.workspace }}/stable-source/editor_integrations/vscode/node_modules/.bin/vsce
        run: |
          set -euo pipefail
          approval_waiver_args=()
          if [[ "${GOVERNANCE_MODE}" == "ga-activation" ]]; then
            approval_waiver_args=(
              --approval-waiver "${SINGLE_MAINTAINER_APPROVAL_WAIVER}"
            )
          fi
          scripts/distribution/run_stable_publication.sh \
            --operation "${GOVERNANCE_MODE}" --mode "${PUBLICATION_MODE}" \
            --repository "${GITHUB_REPOSITORY}" --evidence-root stable-evidence \
            --evidence-commit "${EVIDENCE_COMMIT}" \
            --candidate-path "${CANDIDATE_PATH}" \
            --expected-plan-sha256 "${EXPECTED_PLAN_SHA256}" \
            --source-root stable-source \
            --prepare-summary protected-prepare/summary.json \
            --expected-summary-sha256 "${PREPARE_SUMMARY_SHA256}" \
            --workflow-ref "${GITHUB_REF}" --workflow-commit "${GITHUB_SHA}" \
            --run-id "${GITHUB_RUN_ID}" --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --initiator "${GITHUB_TRIGGERING_ACTOR}" \
            "${approval_waiver_args[@]}" \
            --expected-approval-waiver-sha256 "${SINGLE_MAINTAINER_APPROVAL_WAIVER_SHA256}" \
            --site-repository "${SITE_REPOSITORY}" \
            --site-workflow "${SITE_WORKFLOW}" \
            --site-workflow-ref "${SITE_WORKFLOW_REF}" \
            --site-ruleset-id "${SITE_WORKFLOW_RULESET_ID}" \
            --site-ruleset-updated-at "${SITE_WORKFLOW_RULESET_UPDATED_AT}" \
            --site-workflow-sha256 "${SITE_WORKFLOW_SHA256}"
      - name: Run exact protected incident publication
        if: env.INCIDENT_OPERATION == 'true'
        shell: bash
        env:
          SITE_TOKEN: ${{ secrets.SIFR_WEBSITE_ACTIONS_TOKEN }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VSCE_BIN: ${{ github.workspace }}/stable-source/editor_integrations/vscode/node_modules/.bin/vsce
        run: |
          set -euo pipefail
          arguments=(
            --operation "${GOVERNANCE_MODE}" --mode "${PUBLICATION_MODE}"
            --repository "${GITHUB_REPOSITORY}" --incident-root incident-evidence
            --incident-commit "${INCIDENT_COMMIT}" --incident-path "${INCIDENT_PATH}"
            --expected-request-sha256 "${EXPECTED_REQUEST_SHA256}"
            --prepare-summary protected-prepare/summary.json
            --expected-summary-sha256 "${PREPARE_SUMMARY_SHA256}"
            --workflow-ref "${GITHUB_REF}" --workflow-commit "${GITHUB_SHA}"
            --run-id "${GITHUB_RUN_ID}" --run-attempt "${GITHUB_RUN_ATTEMPT}"
            --initiator "${GITHUB_TRIGGERING_ACTOR}"
            --site-repository "${SITE_REPOSITORY}" --site-workflow "${SITE_WORKFLOW}"
            --site-workflow-ref "${SITE_WORKFLOW_REF}"
            --site-ruleset-id "${SITE_WORKFLOW_RULESET_ID}"
            --site-ruleset-updated-at "${SITE_WORKFLOW_RULESET_UPDATED_AT}"
            --site-workflow-sha256 "${SITE_WORKFLOW_SHA256}"
          )
          if [[ "${GOVERNANCE_MODE}" == "incident-roll-forward" ]]; then
            arguments+=(
              --candidate-root stable-evidence --candidate-commit "${EVIDENCE_COMMIT}"
              --candidate-path "${CANDIDATE_PATH}"
              --expected-plan-sha256 "${EXPECTED_PLAN_SHA256}"
              --source-root stable-source
            )
          fi
          scripts/distribution/run_incident_publication.sh "${arguments[@]}"
  drill:
    if: ${{ startsWith(inputs.governance_mode, 'drill-') }}
    uses: ./.github/workflows/release-publication-drill.yml
    permissions:
      contents: read
    with:
      mode: ${{ inputs.governance_mode }}
