name: preview-release
run-name: Preview release ${{ inputs.version }} (${{ inputs.channel }})

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Preview channel to publish
        required: true
        type: choice
        options:
          - alpha
          - beta
      version:
        description: Semver prerelease version, for example 0.1.0-beta.1
        required: true
        type: string
      base_ref:
        description: Ref to build
        required: false
        default: main
        type: string
      governance_mode:
        description: Ordinary preview publication or one-time protected schema bootstrap stage
        required: false
        default: preview
        type: choice
        options:
          - preview
          - bootstrap-alpha
          - bootstrap-index
      bootstrap_alpha_version:
        description: Fresh protected alpha version required only by bootstrap-index
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: write

jobs:
  validate:
    name: validate preview inputs
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.validate.outputs.version }}
      channel: ${{ steps.validate.outputs.channel }}
      base_ref: ${{ steps.validate.outputs.base_ref }}
      source_sha: ${{ steps.validate.outputs.source_sha }}
      site_base_commit: ${{ steps.validate.outputs.site_base_commit }}
      governance_mode: ${{ steps.validate.outputs.governance_mode }}
      bootstrap_alpha_version: ${{ steps.validate.outputs.bootstrap_alpha_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.base_ref || 'main' }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Validate channel, version, and immutable site base
        id: validate
        shell: bash
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BASE_REF: ${{ inputs.base_ref }}
          GOVERNANCE_MODE: ${{ inputs.governance_mode }}
          BOOTSTRAP_ALPHA_VERSION: ${{ inputs.bootstrap_alpha_version }}
          SITE_BASE_COMMIT: ff472f2af59255c8031b1a6f9b9b294c4b820496
        run: |
          set -euo pipefail
          case "${INPUT_CHANNEL}" in
            alpha|beta) ;;
            *) echo "::error::channel must be alpha or beta"; exit 2 ;;
          esac
          if [[ ! "${INPUT_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta)\.[0-9]+$ ]]; then
            echo "::error::version must be a semver prerelease using -alpha.N or -beta.N"
            exit 2
          fi
          if [[ "${BASH_REMATCH[1]}" != "${INPUT_CHANNEL}" ]]; then
            echo "::error::version ${INPUT_VERSION} belongs to ${BASH_REMATCH[1]}, not ${INPUT_CHANNEL}"
            exit 2
          fi
          case "${GOVERNANCE_MODE}" in
            preview)
              test -z "${BOOTSTRAP_ALPHA_VERSION}" || {
                echo "::error::ordinary preview publication cannot name a bootstrap alpha"
                exit 2
              }
              ;;
            bootstrap-alpha)
              test "${INPUT_CHANNEL}" = "alpha" || {
                echo "::error::bootstrap-alpha requires an alpha release"
                exit 2
              }
              test -z "${BOOTSTRAP_ALPHA_VERSION}" || {
                echo "::error::bootstrap-alpha does not accept bootstrap_alpha_version"
                exit 2
              }
              ;;
            bootstrap-index)
              test "${INPUT_CHANNEL}" = "beta" || {
                echo "::error::bootstrap-index requires a beta release"
                exit 2
              }
              [[ "${BOOTSTRAP_ALPHA_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]] || {
                echo "::error::bootstrap-index requires a fresh alpha version"
                exit 2
              }
              ;;
            *)
              echo "::error::unsupported governance_mode"
              exit 2
              ;;
          esac
          if [[ ! "${SITE_BASE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::preview release must pin an exact merged website commit"
            exit 2
          fi
          {
            echo "version=${INPUT_VERSION}"
            echo "channel=${INPUT_CHANNEL}"
            echo "base_ref=${INPUT_BASE_REF:-main}"
            echo "source_sha=$(git rev-parse HEAD)"
            echo "site_base_commit=${SITE_BASE_COMMIT}"
            echo "governance_mode=${GOVERNANCE_MODE}"
            echo "bootstrap_alpha_version=${BOOTSTRAP_ALPHA_VERSION}"
          } >>"${GITHUB_OUTPUT}"

  build-artifacts:
    name: build ${{ matrix.target }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          submodules: recursive
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Build target binary
        env:
          SIFR_RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: cargo build --release --locked -p sifr --target "${{ matrix.target }}"

      - name: Package immutable target artifact
        shell: bash
        run: |
          set -euo pipefail
          scripts/distribution/build_release_artifacts.sh \
            --version "${{ needs.validate.outputs.version }}" \
            --output-dir dist \
            --binary "target/${{ matrix.target }}/release/sifr" \
            --target "${{ matrix.target }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sifr-${{ needs.validate.outputs.version }}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: governed preview publication
    needs:
      - validate
      - build-artifacts
    uses: ./.github/workflows/release-publication.yml
    permissions:
      actions: read
      contents: write
    with:
      channel: ${{ needs.validate.outputs.channel }}
      version: ${{ needs.validate.outputs.version }}
      base_ref: ${{ needs.validate.outputs.base_ref }}
      source_commit: ${{ needs.validate.outputs.source_sha }}
      site_base_commit: ${{ needs.validate.outputs.site_base_commit }}
      governance_mode: ${{ needs.validate.outputs.governance_mode }}
      bootstrap_alpha_version: ${{ needs.validate.outputs.bootstrap_alpha_version }}
    secrets:
      SIFR_WEBSITE_ACTIONS_TOKEN: ${{ secrets.SIFR_WEBSITE_ACTIONS_TOKEN }}
