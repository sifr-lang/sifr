name: iteration-cloud-protocol-breakdown
run-name: Observational cloud protocol breakdown (30-minute per-category cap)
on:
  workflow_dispatch:
    inputs:
      source_commit:
        required: true
        type: string
      version:
        required: true
        type: string
      rollback_version:
        required: false
        default: none
        type: string
      case_prefix:
        required: false
        default: ''
        type: string
permissions:
  contents: read
jobs:
  cloud-cost-observation:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CARGO_BUILD_JOBS: '2'
      RAYON_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      SIFR_PERFORMANCE_HOST_KIND: managed-linux
      SIFR_PERFORMANCE_TIME: /usr/bin/time
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Admit observational-only inputs
        env:
          SOURCE: ${{ inputs.source_commit }}
          MODE: ${{ inputs.version }}
        run: |
          test "$SOURCE" = bdcf3ce90d09e29f128f3f547728b426358ac753
          test "$MODE" = observational-only
      - name: Checkout isolated measurement harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: measurement-tools
          persist-credentials: false
      - name: Checkout frozen candidate
        timeout-minutes: 30
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: bdcf3ce90d09e29f128f3f547728b426358ac753
          path: candidate
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Checkout independent compiler reference
        timeout-minutes: 30
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5fbeee50c2f70abd47e5bfcb98d1f1cd0b978042
          path: baseline
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Overlay only the protocol's allowed measurement files
        timeout-minutes: 30
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil, subprocess
          root=Path.cwd(); baseline=root/'baseline'; candidate=root/'candidate'
          area='verification/areas/performance'
          # This is an owned historical-reference checkout; compiler inputs remain at 5fbeee50.
          shutil.rmtree(baseline/area)
          shutil.copytree(candidate/area, baseline/area)
          for name in ('__init__.py','process_execution.py','process_supervisor.py','process_disk_budget.py'):
              relative=Path('verification/runner/sifr_verify')/name
              shutil.copy2(candidate/relative,baseline/relative)
          subprocess.run(['git','add',area,'verification/runner/sifr_verify/__init__.py',
                          'verification/runner/sifr_verify/process_execution.py',
                          'verification/runner/sifr_verify/process_supervisor.py',
                          'verification/runner/sifr_verify/process_disk_budget.py'],cwd=baseline,check=True)
          subprocess.run(['git','-c','user.name=Iteration measurement','-c','user.email=measurement@localhost',
                          'commit','--allow-empty','-m','Bind reviewed cloud measurement tooling to historical compiler'],cwd=baseline,check=True)
          PY
      - name: Provision exact Rust toolchain
        timeout-minutes: 30
        uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e
        with:
          toolchain: 1.98.1
      - name: Provision exact uv
        timeout-minutes: 30
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version-file: candidate/verification/pyproject.toml
          checksum: 173d95a0c32d18c896c46ba6fafbf3cf9c14ab74b033f81b76c883ef492a976b
      - name: Provision shared external verifier environment
        timeout-minutes: 30
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/sifr-observation-python
        run: |
          uv python install 3.14.7
          uv sync --project candidate/verification --locked
      - name: Measure protocol mini categories sequentially
        env:
          CASE_PREFIX: ${{ inputs.case_prefix }}
        shell: bash
        run: |
          export PATH="$RUNNER_TEMP/sifr-observation-python/bin:$PATH"
          export LD_LIBRARY_PATH="$(dirname "$(rustup which rustc)")/../lib"
          # Bind actual finite limits before identity admission; no identity checks are bypassed.
          sudo systemd-run --wait --pipe --collect --unit=sifr-cost-observation \
            -p "User=$(id -un)" -p "WorkingDirectory=$GITHUB_WORKSPACE" \
            -p CPUQuota=400% -p MemoryMax=12G \
            /usr/bin/env "HOME=$HOME" "PATH=$PATH" "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" \
            CARGO_BUILD_JOBS=2 RAYON_NUM_THREADS=2 OMP_NUM_THREADS=2 \
            SIFR_PERFORMANCE_HOST_KIND=managed-linux SIFR_PERFORMANCE_TIME=/usr/bin/time \
            PYTHONDONTWRITEBYTECODE=1 \
            python "$GITHUB_WORKSPACE/measurement-tools/scripts/iteration_measurement/cloud_observer.py" \
            --candidate "$GITHUB_WORKSPACE/candidate" --baseline "$GITHUB_WORKSPACE/baseline" \
            --evidence "$RUNNER_TEMP/cloud-protocol-observations" --case-prefix "$CASE_PREFIX"
      - name: Preserve partial diagnostic evidence
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import os,tarfile
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'cloud-protocol-observations'
          if not root.exists():
              root.mkdir();(root/'not-started.txt').write_text('Observation controller did not start; inspect provisioning step failures.')
          with tarfile.open(Path(os.environ['RUNNER_TEMP'])/'cloud-protocol-observations.tar.gz','w:gz') as archive:
              for path in sorted(root.rglob('*')):
                  if not path.is_file() or path.is_symlink():continue
                  relative=path.relative_to(root)
                  if relative.parts[0]=='artifacts' or path.name in {'sifr','frontend_query_bench'}:continue
                  archive.add(path,arcname=str(relative),recursive=False)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: cloud-protocol-cost-observations
          path: ${{ runner.temp }}/cloud-protocol-observations.tar.gz
          retention-days: 14
