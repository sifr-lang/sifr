name: release-qualification
run-name: Qualify stable candidate ${{ inputs.version }} at ${{ inputs.source_commit }}

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact lowercase 40-hex source commit
        required: true
        type: string
      version:
        description: Exact stable SemVer
        required: true
        type: string
      rollback_version:
        description: Exact stable rollback SemVer, or none for first GA
        required: true
        default: none
        type: string

permissions:
  contents: read
  actions: read

jobs:
  validate:
    name: validate immutable candidate identity
    runs-on: ubuntu-24.04
    outputs:
      source_commit: ${{ steps.identity.outputs.source_commit }}
      version: ${{ steps.identity.outputs.version }}
      rollback_version: ${{ steps.identity.outputs.rollback_version }}
      fixture_version: ${{ steps.package_versions.outputs.fixture_version }}
    steps:
      - name: Validate exact inputs
        id: identity
        shell: bash
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          VERSION: ${{ inputs.version }}
          ROLLBACK_VERSION: ${{ inputs.rollback_version }}
          WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "${SOURCE_COMMIT}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::source_commit must be an exact lowercase 40-hex commit"
            exit 2
          }
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::version must be exact stable SemVer"
            exit 2
          }
          [[ "${ROLLBACK_VERSION}" = "none" || \
            "${ROLLBACK_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::rollback_version must be none or exact stable SemVer"
            exit 2
          }
          [[ "${WORKFLOW_COMMIT}" = "${SOURCE_COMMIT}" ]] || {
            echo "::error::dispatch ref must resolve to source_commit"
            exit 2
          }
          echo "source_commit=${SOURCE_COMMIT}" >>"${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >>"${GITHUB_OUTPUT}"
          echo "rollback_version=${ROLLBACK_VERSION}" >>"${GITHUB_OUTPUT}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.identity.outputs.source_commit }}
          fetch-depth: 1
          submodules: recursive

      - name: Verify checkout identity
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.identity.outputs.source_commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_COMMIT}"
          if git submodule status --recursive | grep -E '^[+-U]'; then
            echo "::error::recursive submodule checkout is unresolved"
            exit 2
          fi

      - name: Admit package versions before native compilation
        id: package_versions
        shell: bash
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          ROLLBACK_VERSION: ${{ steps.identity.outputs.rollback_version }}
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          import sys

          sys.path.insert(0, "scripts/distribution")
          from qualify_native_package import transition_fixture_version

          previous = transition_fixture_version(
              Path.cwd(), os.environ["VERSION"], os.environ["ROLLBACK_VERSION"])
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"fixture_version={previous}\n")
          PYTHON

      - name: Verify immutable qualification workflow contract
        shell: bash
        run: verification/areas/distribution_release/cases/release_qualification_workflow_contract.sh

  build:
    name: qualify ${{ matrix.target }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_commit }}
          fetch-depth: 1
          submodules: recursive

      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # Rust 1.98.1
        with:
          targets: ${{ matrix.target }}

      - name: Build, package, and smoke target bundle
        shell: bash
        env:
          SOURCE_COMMIT: ${{ needs.validate.outputs.source_commit }}
          VERSION: ${{ needs.validate.outputs.version }}
          TARGET: ${{ matrix.target }}
          BUILDER: ${{ matrix.runner }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_COMMIT}"
          mkdir -p dist qualification
          scripts/distribution/build_release_artifacts.sh \
            --version "${VERSION}" \
            --output-dir dist \
            --cargo-build \
            --target "${TARGET}"
          archive="dist/sifr-${VERSION}-${TARGET}.tar.gz"
          scripts/distribution/qualify_stable_target.py \
            --archive "${archive}" \
            --version "${VERSION}" \
            --target "${TARGET}" \
            --builder "${BUILDER}" \
            --source-commit "${SOURCE_COMMIT}" \
            --out-dir qualification
          cp "${archive}" "${archive}.sha256" qualification/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sifr-stable-candidate-${{ needs.validate.outputs.version }}-${{ needs.validate.outputs.source_commit }}-${{ matrix.target }}
          path: qualification/*
          if-no-files-found: error
          retention-days: 30
          overwrite: false

  editor:
    name: qualify VS Code package
    needs:
      - validate
      - build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_commit }}
          fetch-depth: 1
          submodules: recursive

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: editor_integrations/vscode/.node-version
          cache: npm
          cache-dependency-path: editor_integrations/vscode/package-lock.json

      - name: Provision exact npm
        shell: bash
        run: |
          npm_bin="$(bash editor_integrations/vscode/scripts/setup-npm.sh "${RUNNER_TEMP}/sifr-npm")"
          echo "${npm_bin}" >> "${GITHUB_PATH}"

      - name: Check Node and npm selectors
        run: python3 scripts/check_node_toolchain.py

      - name: Download exact x86_64 Linux candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sifr-stable-candidate-${{ needs.validate.outputs.version }}-${{ needs.validate.outputs.source_commit }}-x86_64-unknown-linux-gnu
          path: candidate-toolchain
          digest-mismatch: error

      - name: Build, test, and package VSIX
        shell: bash
        env:
          SOURCE_COMMIT: ${{ needs.validate.outputs.source_commit }}
          VERSION: ${{ needs.validate.outputs.version }}
          ROLLBACK_VERSION: ${{ needs.validate.outputs.rollback_version }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_COMMIT}"
          npm ci --ignore-scripts --include=dev --prefix editor_integrations/vscode
          for script in lint typecheck test test:extension package; do
            npm run --prefix editor_integrations/vscode "${script}"
          done
          mkdir -p qualification-editor
          archive="candidate-toolchain/sifr-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          test -f "${archive}"
          mkdir -p installed-candidate
          tar -xzf "${archive}" -C installed-candidate
          candidate_binary="installed-candidate/bin/sifr"
          test -x "${candidate_binary}"
          built=(editor_integrations/vscode/dist/*.vsix)
          test "${#built[@]}" -eq 1
          cp "${built[0]}" qualification-editor/
          python3 scripts/distribution/qualify_stable_editor.py \
            --source-root "${GITHUB_WORKSPACE}" \
            --source-commit "${SOURCE_COMMIT}" \
            --candidate-version "${VERSION}" \
            --rollback-version "${ROLLBACK_VERSION}" \
            --candidate-binary "${candidate_binary}" \
            --target-report \
              candidate-toolchain/qualification-x86_64-unknown-linux-gnu.json \
            --vsix "qualification-editor/$(basename "${built[0]}")" \
            --out qualification-editor/qualification-editor.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sifr-stable-candidate-${{ needs.validate.outputs.version }}-${{ needs.validate.outputs.source_commit }}-editor
          path: qualification-editor/*
          if-no-files-found: error
          retention-days: 30
          overwrite: false

  assemble:
    name: assemble installer and checksums
    needs:
      - validate
      - build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_commit }}
          fetch-depth: 1
          submodules: recursive

      - name: Download aarch64 macOS candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sifr-stable-candidate-${{ needs.validate.outputs.version }}-${{ needs.validate.outputs.source_commit }}-aarch64-apple-darwin
          path: target-artifacts
          digest-mismatch: error

      - name: Download x86_64 macOS candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sifr-stable-candidate-${{ needs.validate.outputs.version }}-${{ needs.validate.outputs.source_commit }}-x86_64-apple-darwin
          path: target-artifacts
          digest-mismatch: error

      - name: Download aarch64 Linux candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sifr-stable-candidate-${{ needs.validate.outputs.version }}-${{ needs.validate.outputs.source_commit }}-aarch64-unknown-linux-gnu
          path: target-artifacts
          digest-mismatch: error

      - name: Download x86_64 Linux candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sifr-stable-candidate-${{ needs.validate.outputs.version }}-${{ needs.validate.outputs.source_commit }}-x86_64-unknown-linux-gnu
          path: target-artifacts
          digest-mismatch: error

      - name: Verify matrix and assemble aggregate assets
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_COMMIT: ${{ needs.validate.outputs.source_commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_COMMIT}"
          mkdir -p qualification-assemble
          for target in \
            aarch64-apple-darwin \
            x86_64-apple-darwin \
            x86_64-unknown-linux-gnu \
            aarch64-unknown-linux-gnu
          do
            archive="target-artifacts/sifr-${VERSION}-${target}.tar.gz"
            test -f "${archive}"
            test -f "${archive}.sha256"
            test -f "target-artifacts/qualification-${target}.json"
            scripts/distribution/verify_release_archive.py \
              "${archive}" \
              --version "${VERSION}" \
              --target "${target}"
          done
          scripts/distribution/generate_version_installer.sh \
            --version "${VERSION}" \
            --artifact-dir target-artifacts \
            --out "qualification-assemble/sifr-installer-${VERSION}"
          (
            cd target-artifacts
            for path in *.tar.gz *.tar.gz.sha256; do
              if command -v sha256sum >/dev/null 2>&1; then
                sha256sum "${path}"
              else
                shasum -a 256 "${path}"
              fi
            done
          ) | LC_ALL=C sort >qualification-assemble/checksums.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sifr-stable-candidate-${{ needs.validate.outputs.version }}-${{ needs.validate.outputs.source_commit }}-assemble
          path: qualification-assemble/*
          if-no-files-found: error
          retention-days: 30
          overwrite: false

  collect:
    name: collect immutable qualification index
    needs:
      - validate
      - build
      - editor
      - assemble
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_commit }}
          fetch-depth: 1
          submodules: recursive

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sifr-stable-candidate-${{ needs.validate.outputs.version }}-${{ needs.validate.outputs.source_commit }}-*
          path: collected
          merge-multiple: false
          digest-mismatch: error

      - name: Collect run metadata and recursive submodules
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ needs.validate.outputs.source_commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_COMMIT}"
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
            >run-artifacts.json
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            >run-metadata.json
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          output = subprocess.run(
              ["git", "submodule", "status", "--recursive"],
              check=True,
              text=True,
              stdout=subprocess.PIPE,
          ).stdout
          submodules = {}
          for line in output.splitlines():
              if not line or line[0] in "-+U":
                  raise SystemExit(f"unresolved submodule state: {line}")
              commit, path, *_ = line[1:].split()
              submodules[path] = commit
          Path("submodules.json").write_text(
              json.dumps(submodules, sort_keys=True, separators=(",", ":")) + "\n"
          )
          PY

      - name: Build canonical qualification artifact index
        shell: bash
        env:
          SOURCE_COMMIT: ${{ needs.validate.outputs.source_commit }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          scripts/distribution/collect_qualification_artifacts.py \
            --version "${VERSION}" \
            --source-commit "${SOURCE_COMMIT}" \
            --submodules submodules.json \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --run-metadata run-metadata.json \
            --run-artifacts run-artifacts.json \
            --artifact-root collected \
            --out qualification-artifact-index.json

      - name: Upload qualification artifact index
        id: upload-index
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sifr-stable-candidate-${{ needs.validate.outputs.version }}-${{ needs.validate.outputs.source_commit }}-index
          path: qualification-artifact-index.json
          if-no-files-found: error
          retention-days: 30
          overwrite: false

      - name: Record collector identity
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload-index.outputs.artifact-id }}
        run: |
          {
            echo "### Stable qualification artifact index"
            echo
            echo "Artifact ID: \`${ARTIFACT_ID}\`"
            echo "Source commit: \`${{ needs.validate.outputs.source_commit }}\`"
            echo "Version: \`${{ needs.validate.outputs.version }}\`"
          } >>"${GITHUB_STEP_SUMMARY}"

  native-packages:
    name: install and update exact native package ${{ matrix.target }}
    # Run after collection so additional test evidence cannot enter the
    # governed release artifact index or acquire publication authority.
    needs:
      - validate
      - collect
      - transition-assemble
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_commit }}
          fetch-depth: 1
          submodules: recursive

      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # Rust 1.98.1
        with:
          targets: ${{ matrix.target }}

      - name: Download exact indexed candidate packages and installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sifr-stable-candidate-${{ needs.validate.outputs.version }}-${{ needs.validate.outputs.source_commit }}-*
          path: native-inputs
          merge-multiple: true
          digest-mismatch: error

      - name: Download exact lower-version packages and installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sifr-native-transition-${{ needs.validate.outputs.fixture_version }}-${{ needs.validate.outputs.source_commit }}-*
          path: transition-inputs
          merge-multiple: true
          digest-mismatch: error

      - name: Prepare locked source-reference dependencies
        shell: bash
        run: cargo fetch --locked

      - name: Qualify exact native package modes
        shell: bash
        env:
          SOURCE_COMMIT: ${{ needs.validate.outputs.source_commit }}
          VERSION: ${{ needs.validate.outputs.version }}
          TARGET: ${{ matrix.target }}
          PREVIOUS_VERSION: ${{ needs.validate.outputs.fixture_version }}
          CARGO_BUILD_JOBS: "2"
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_COMMIT}"
          python3 scripts/distribution/qualify_native_package.py \
            --artifacts native-inputs \
            --installer "native-inputs/sifr-installer-${VERSION}" \
            --version "${VERSION}" \
            --target "${TARGET}" \
            --source-commit "${SOURCE_COMMIT}" \
            --output "${RUNNER_TEMP}/sifr-native-qualification" \
            --previous-version "${PREVIOUS_VERSION}" \
            --previous-artifacts transition-inputs \
            --previous-installer "transition-inputs/sifr-installer-${PREVIOUS_VERSION}"

      - name: Bundle bounded native qualification evidence
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import tarfile

          import os
          root = Path(os.environ["RUNNER_TEMP"]) / "sifr-native-qualification"
          if not root.is_dir():
              raise SystemExit("native qualification did not start")
          excluded = {"cache", "managed", "relocated", "producer-source",
                      "generation-a", "moved-generation-a", "generation-b"}
          paths = []
          for path in sorted(root.rglob("*")):
              relative = path.relative_to(root)
              if not path.is_file() or path.is_symlink():
                  continue
              if any(part in excluded for part in relative.parts):
                  continue
              if "corpus" in relative.parts and path.name != "coverage.json":
                  continue
              if path.suffix in {".json", ".jsonl", ".stdout", ".stderr"}:
                  paths.append(path)
          manifest = [{"path": str(path.relative_to(root)),
                       "sha256": hashlib.sha256(path.read_bytes()).hexdigest()}
                      for path in paths]
          root.joinpath("evidence-index.json").write_text(json.dumps(manifest, indent=2) + "\n")
          paths.append(root / "evidence-index.json")
          with tarfile.open("native-qualification-evidence.tar.gz", "w:gz") as bundle:
              for path in paths:
                  bundle.add(path, arcname=path.relative_to(root), recursive=False)
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sifr-native-package-${{ needs.validate.outputs.version }}-${{ needs.validate.outputs.source_commit }}-${{ matrix.target }}
          path: native-qualification-evidence.tar.gz
          if-no-files-found: error
          retention-days: 30
          overwrite: false

  transition-build:
    name: build lower-version native fixture ${{ matrix.target }}
    needs:
      - validate
      - collect
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_commit }}
          fetch-depth: 1
          submodules: recursive

      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # Rust 1.98.1
        with:
          targets: ${{ matrix.target }}

      - name: Build exact lower-version transition fixture
        shell: bash
        env:
          SOURCE_COMMIT: ${{ needs.validate.outputs.source_commit }}
          VERSION: ${{ needs.validate.outputs.fixture_version }}
          TARGET: ${{ matrix.target }}
          BUILDER: ${{ matrix.runner }}
          CARGO_BUILD_JOBS: "2"
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_COMMIT}"
          mkdir -p dist transition-qualification
          scripts/distribution/build_release_artifacts.sh \
            --version "${VERSION}" \
            --output-dir dist \
            --cargo-build \
            --target "${TARGET}"
          archive="dist/sifr-${VERSION}-${TARGET}.tar.gz"
          scripts/distribution/qualify_stable_target.py \
            --archive "${archive}" \
            --version "${VERSION}" \
            --target "${TARGET}" \
            --builder "${BUILDER}" \
            --source-commit "${SOURCE_COMMIT}" \
            --out-dir transition-qualification
          cp "${archive}" "${archive}.sha256" transition-qualification/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sifr-native-transition-${{ needs.validate.outputs.fixture_version }}-${{ needs.validate.outputs.source_commit }}-${{ matrix.target }}
          path: transition-qualification/*
          if-no-files-found: error
          retention-days: 30
          overwrite: false

  transition-assemble:
    name: assemble exact lower-version fixture installer
    needs:
      - validate
      - transition-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_commit }}
          fetch-depth: 1
          submodules: recursive

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sifr-native-transition-${{ needs.validate.outputs.fixture_version }}-${{ needs.validate.outputs.source_commit }}-*
          path: transition-artifacts
          merge-multiple: true
          digest-mismatch: error

      - name: Generate canonical fixture installer
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.fixture_version }}
          SOURCE_COMMIT: ${{ needs.validate.outputs.source_commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_COMMIT}"
          scripts/distribution/generate_version_installer.sh \
            --version "${VERSION}" \
            --artifact-dir transition-artifacts \
            --out "transition-installer/sifr-installer-${VERSION}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sifr-native-transition-${{ needs.validate.outputs.fixture_version }}-${{ needs.validate.outputs.source_commit }}-installer
          path: transition-installer/*
          if-no-files-found: error
          retention-days: 30
          overwrite: false
