name: release-qualification
run-name: DXF.7 remaining native checks for ${{ inputs.source_commit }}
on:
  workflow_dispatch:
    inputs:
      source_commit:
        required: true
        type: string
      original_run_id:
        required: true
        type: string
      targets:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  remaining:
    name: remaining native contracts ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.targets) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_commit }}
          path: source
          submodules: recursive
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: validation
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e
        with:
          targets: ${{ matrix.target }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sifr-stable-candidate-0.1.0-${{ inputs.source_commit }}-${{ matrix.target }}
          run-id: ${{ inputs.original_run_id }}
          github-token: ${{ github.token }}
          path: native-inputs
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sifr-stable-candidate-0.1.0-${{ inputs.source_commit }}-assemble
          run-id: ${{ inputs.original_run_id }}
          github-token: ${{ github.token }}
          path: native-inputs
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sifr-stable-candidate-0.1.0-${{ inputs.source_commit }}-index
          run-id: ${{ inputs.original_run_id }}
          github-token: ${{ github.token }}
          path: native-inputs
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sifr-native-transition-0.0.0-${{ inputs.source_commit }}-installer
          run-id: ${{ inputs.original_run_id }}
          github-token: ${{ github.token }}
          path: previous-inputs
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sifr-native-package-0.1.0-${{ inputs.source_commit }}-${{ matrix.target }}
          run-id: ${{ inputs.original_run_id }}
          github-token: ${{ github.token }}
          path: prior-evidence
          digest-mismatch: error
      - name: Fetch locked source dependencies
        working-directory: source
        run: cargo fetch --locked
      - name: Run only failed or previously unreached native checks
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          ORIGINAL_RUN_ID: ${{ inputs.original_run_id }}
          TARGET: ${{ matrix.target }}
          CARGO_BUILD_JOBS: "2"
        run: python3 validation/.github/dxf7-native-continuation.py
      - name: Bundle bounded continuation evidence
        if: always()
        run: |
          python3 - <<PY
          import hashlib,json,os,tarfile
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"sifr-native-continuation"
          excluded={"cache","exact-package","producer-source","dxf-source-tmp"}
          paths=[]
          for p in sorted(root.rglob("*")):
              rel=p.relative_to(root)
              if not p.is_file() or p.is_symlink() or any(x in excluded for x in rel.parts):continue
              if "corpus" in rel.parts and p.name!="coverage.json":continue
              if p.suffix in {".json",".jsonl",".stdout",".stderr"}:paths.append(p)
          index=root/"evidence-index.json"
          index.write_text(json.dumps([{"path":str(p.relative_to(root)),"sha256":hashlib.sha256(p.read_bytes()).hexdigest()} for p in paths],indent=2)+"\n")
          paths.append(index)
          with tarfile.open("native-continuation-evidence.tar.gz","w:gz") as tar:
              for p in paths:tar.add(p,arcname=p.relative_to(root),recursive=False)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: sifr-dxf7-native-continuation-${{ inputs.source_commit }}-${{ matrix.target }}-${{ github.sha }}
          path: native-continuation-evidence.tar.gz
          retention-days: 30
          overwrite: false
          if-no-files-found: error
