name: iteration-native-measurement
run-name: Nonpublishing native measurement from artifacts 38074052189
on:
  workflow_dispatch:
    inputs:
      source_commit:
        required: true
        type: string
      version:
        required: true
        type: string
      rollback_version:
        required: true
        default: none
        type: string
permissions:
  contents: read
  actions: read
jobs:
  native-measurement:
    name: measure native modes ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Admit fixed observational inputs
        env:
          SOURCE: ${{ inputs.source_commit }}
          VERSION: ${{ inputs.version }}
          ROLLBACK: ${{ inputs.rollback_version }}
        shell: bash
        run: |
          test "$SOURCE" = 36c87c5b2a0f178f4f590f4f975bb6197c6d43d3
          test "$VERSION" = 0.1.0
          test "$ROLLBACK" = none
      - name: Checkout measurement harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: measurement-tools
          persist-credentials: false
      - name: Checkout exact artifact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 36c87c5b2a0f178f4f590f4f975bb6197c6d43d3
          path: candidate
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}
      - name: Download unchanged indexed candidate artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          run-id: 38074052189
          pattern: sifr-stable-candidate-0.1.0-36c87c5b2a0f178f4f590f4f975bb6197c6d43d3-*
          path: native-inputs
          merge-multiple: true
          digest-mismatch: error
      - name: Download unchanged rollback fixture artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          run-id: 38074052189
          pattern: sifr-native-transition-0.0.0-36c87c5b2a0f178f4f590f4f975bb6197c6d43d3-*
          path: transition-inputs
          merge-multiple: true
          digest-mismatch: error
      - name: Prepare locked source-reference dependencies
        working-directory: candidate
        run: cargo fetch --locked
      - name: Prepare exact driver source test graph
        working-directory: candidate
        env:
          CARGO_BUILD_JOBS: "2"
          CARGO_NET_OFFLINE: "true"
        run: cargo test --locked --offline -p sifr_driver --lib --no-run
      - name: Prepare exact LSP source test graph
        working-directory: candidate
        env:
          CARGO_BUILD_JOBS: "2"
          CARGO_NET_OFFLINE: "true"
        run: cargo test --locked --offline -p sifr_lsp --lib --no-run
      - name: Measure exact native package modes with current cache contract
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          CARGO_BUILD_JOBS: "2"
        run: |
          python3 measurement-tools/scripts/iteration_measurement/run_native.py "$GITHUB_WORKSPACE/candidate" \
            --artifacts "$GITHUB_WORKSPACE/native-inputs" \
            --installer "$GITHUB_WORKSPACE/native-inputs/sifr-installer-0.1.0" \
            --version 0.1.0 --target "$TARGET" \
            --source-commit 36c87c5b2a0f178f4f590f4f975bb6197c6d43d3 \
            --output "$RUNNER_TEMP/sifr-native-qualification" \
            --previous-version 0.0.0 \
            --previous-artifacts "$GITHUB_WORKSPACE/transition-inputs" \
            --previous-installer "$GITHUB_WORKSPACE/transition-inputs/sifr-installer-0.0.0"
      - name: Bundle bounded native qualification evidence
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import tarfile

          import os
          root = Path(os.environ["RUNNER_TEMP"]) / "sifr-native-qualification"
          if not root.is_dir():
              raise SystemExit("native qualification did not start")
          excluded = {"cache", "managed", "relocated", "producer-source",
                      "generation-a", "moved-generation-a", "generation-b"}
          paths = []
          for path in sorted(root.rglob("*")):
              relative = path.relative_to(root)
              if not path.is_file() or path.is_symlink():
                  continue
              if any(part in excluded for part in relative.parts):
                  continue
              if "corpus" in relative.parts and path.name != "coverage.json":
                  continue
              if path.suffix in {".json", ".jsonl", ".stdout", ".stderr"}:
                  paths.append(path)
          manifest = [{"path": str(path.relative_to(root)),
                       "sha256": hashlib.sha256(path.read_bytes()).hexdigest()}
                      for path in paths]
          root.joinpath("evidence-index.json").write_text(json.dumps(manifest, indent=2) + "\n")
          paths.append(root / "evidence-index.json")
          with tarfile.open("native-qualification-evidence.tar.gz", "w:gz") as bundle:
              for path in paths:
                  bundle.add(path, arcname=path.relative_to(root), recursive=False)
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: measurement-native-continuation-${{ matrix.target }}
          path: native-qualification-evidence.tar.gz
          if-no-files-found: error
          retention-days: 30
          overwrite: false
