name: local-first-validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  uv-toolchain-invariant:
    name: uv-toolchain-invariant
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Verify canonical uv pins and platform checksums
        run: |
          python3 scripts/check_local_first_workflow.py
          python3 scripts/check_uv_toolchain.py --self-test
          python3 scripts/check_uv_toolchain.py

  lint-and-format:
    name: lint-and-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # Rust 1.98.1
      # Advisory until legacy workspace lint debt is burned down by a dedicated cleanup.
      - name: Rustfmt check (advisory)
        continue-on-error: true
        run: cargo fmt --check
      - name: Clippy workspace (advisory)
        continue-on-error: true
        run: cargo clippy --workspace -- -D warnings

  local-first-profiles:
    name: local-first-${{ matrix.profile }}
    runs-on: ubuntu-24.04
    # PRs run only create-pr for fast feedback; broader lanes run on push and manual workflows.
    strategy:
      fail-fast: true
      matrix:
        profile: ${{ fromJSON(github.event_name == 'pull_request' && '["create-pr"]' || '["create-pr", "merge", "release"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # Rust 1.98.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: verification/pyproject.toml
          checksum: 173d95a0c32d18c896c46ba6fafbf3cf9c14ab74b033f81b76c883ef492a976b
      - name: Install canonical Python interpreter
        run: uv python install 3.14.7
      - name: Provision Linux host-tool confinement
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap util-linux
          bwrap --version
          prlimit --version
      - name: Run local-first profile
        run: bash scripts/run_all_tests.sh --profile "${{ matrix.profile }}"

  smoke-fuzz-property:
    name: smoke-fuzz-property
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # Rust 1.98.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: verification/pyproject.toml
          checksum: 173d95a0c32d18c896c46ba6fafbf3cf9c14ab74b033f81b76c883ef492a976b
      - name: Prepare locked smoke dependencies and compiler graphs
        run: uv run --project verification --locked python -m sifr_verify.ci_smoke_setup
      - name: Run smoke fuzz/property checks
        run: uv run --project verification --locked python -m sifr_verify areas run --area fuzz_property --suite cargo-smoke --suite property --suite fuzz-smoke

  compiler-component-targets:
    name: compiler-component-${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # Rust 1.98.1
        with:
          targets: ${{ matrix.target }}
      - name: Prepare locked target dependencies
        run: cargo fetch --locked
      - name: Run Windows generated Rust formatter and native build script contracts
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $cases = @(
            "build::rust_formatter::tests::windows_generated_build_script_uses_a_real_empty_rustfmt_config",
            "build::materialize::tests::source_materialization_writes_a_complete_uncompiled_cargo_project"
          )
          foreach ($case in $cases) {
            cargo test --locked -p sifr_driver --lib --target "${{ matrix.target }}" "$case" -- --exact
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Run Unix generated Rust formatter and native build script contracts
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo test --locked -p sifr_driver --lib --target "${{ matrix.target }}" build::rust_formatter::tests::generated_rust_uses_the_canonical_toolchain_layout -- --exact
          cargo test --locked -p sifr_driver --lib --target "${{ matrix.target }}" build::materialize::tests::python_native_loader_materialization_preserves_selection_and_removes_stale_path -- --exact
          cargo test --locked -p sifr_driver --lib --target "${{ matrix.target }}" build::materialize::tests::source_materialization_writes_a_complete_uncompiled_cargo_project -- --exact
      - name: Run native compiler component qualification
        run: cargo test --locked -p sifr_compiler_component --target "${{ matrix.target }}"
      - name: Run native SQL build qualification
        run: python verification/areas/sql_platform/tools/run_sql_build_qualification.py --target "${{ matrix.target }}"

  sql-wasi-build:
    name: sql-build-wasm32-wasip2
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # Rust 1.98.1
        with:
          targets: wasm32-wasip2
      - name: Prepare locked WASI dependencies
        run: cargo fetch --locked
      - name: Run WASI SQL build qualification
        run: python verification/areas/sql_platform/tools/run_sql_build_qualification.py --target wasm32-wasip2

  deterministic-report-signature:
    name: deterministic-report-signature
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # Rust 1.98.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: verification/pyproject.toml
          checksum: 173d95a0c32d18c896c46ba6fafbf3cf9c14ab74b033f81b76c883ef492a976b
      - name: Verify deterministic report signature
        run: bash verification/runner/e2e/check_report_determinism.sh --profile merge
