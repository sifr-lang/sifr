name: local-first-validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  SIFR_MIN_UV_VERSION: "0.9.28"

jobs:
  lint-and-format:
    name: lint-and-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      # Advisory until legacy workspace lint debt is burned down by a dedicated cleanup.
      - name: Rustfmt check (advisory)
        continue-on-error: true
        run: cargo fmt --check
      - name: Clippy workspace (advisory)
        continue-on-error: true
        run: cargo clippy --workspace -- -D warnings

  local-first-profiles:
    name: local-first-${{ matrix.profile }}
    runs-on: ubuntu-24.04
    # PRs run only create-pr for fast feedback; broader lanes run on push and manual workflows.
    if: github.event_name != 'pull_request' || matrix.profile == 'create-pr'
    strategy:
      fail-fast: true
      matrix:
        profile: [create-pr, merge, release]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.SIFR_MIN_UV_VERSION }}
      - name: Run local-first profile
        run: bash scripts/run_all_tests.sh --profile "${{ matrix.profile }}"

  smoke-fuzz-property:
    name: smoke-fuzz-property
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.SIFR_MIN_UV_VERSION }}
      - name: Run smoke fuzz/property checks
        run: uv run --project verification --locked python -m sifr_verify areas run --area fuzz_property --suite cargo-smoke --suite property --suite fuzz-smoke

  deterministic-report-signature:
    name: deterministic-report-signature
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.SIFR_MIN_UV_VERSION }}
      - name: Verify deterministic report signature
        run: bash verification/runner/e2e/check_report_determinism.sh --profile merge
