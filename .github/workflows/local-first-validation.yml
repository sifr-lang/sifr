name: 95ff-determinism-resource-diagnostic

# Diagnostic-only branch: never merge this workflow into the delivery branch.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-report-diagnostic:
    name: deterministic-report-diagnostic-95ff
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
          ref: 95ff61d1fa9d5789e6ee988333d827df12d708d8
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # Rust 1.98.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: verification/pyproject.toml
          checksum: 173d95a0c32d18c896c46ba6fafbf3cf9c14ab74b033f81b76c883ef492a976b
      - name: Verify deterministic report signature with resource observations
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/95ff-determinism-diagnostic"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/checkout.txt"
          test "$(cat "$evidence/checkout.txt")" = 95ff61d1fa9d5789e6ee988333d827df12d708d8
          cat > "$evidence/sample.py" <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path
          import shutil
          import signal
          import sys
          import time

          output = Path(sys.argv[1])
          stopped = False

          def stop(_signum, _frame):
              global stopped
              stopped = True

          signal.signal(signal.SIGTERM, stop)
          signal.signal(signal.SIGINT, stop)

          def read(path):
              try:
                  return path.read_text().strip()
              except OSError as error:
                  return {"unavailable": type(error).__name__}

          def snapshot():
              row = {"utc": datetime.datetime.now(datetime.timezone.utc).isoformat()}
              memory = read(Path("/proc/meminfo"))
              fields = {"MemTotal", "MemAvailable", "SwapTotal", "SwapFree"}
              row["host_memory"] = (
                  {line.split(":", 1)[0]: line.split(":", 1)[1].strip()
                   for line in memory.splitlines() if line.split(":", 1)[0] in fields}
                  if isinstance(memory, str) else memory
              )
              row["host_memory_pressure"] = read(Path("/proc/pressure/memory"))
              row["disk_free_bytes"] = shutil.disk_usage(os.environ["GITHUB_WORKSPACE"]).free
              row["disk_free_inodes"] = os.statvfs(os.environ["GITHUB_WORKSPACE"]).f_favail
              row["affinity_cpus"] = len(os.sched_getaffinity(0))
              row["load_average"] = os.getloadavg()
              membership = read(Path("/proc/self/cgroup"))
              row["cgroup_membership"] = membership
              row["cgroups"] = []
              if isinstance(membership, str):
                  unified = [line[3:] for line in membership.splitlines() if line.startswith("0::")]
                  if len(unified) == 1 and unified[0].startswith("/"):
                      root = Path("/sys/fs/cgroup").resolve()
                      current = (root / unified[0].lstrip("/")).resolve()
                      if current.is_relative_to(root):
                          while True:
                              record = {"path": str(current)}
                              for name in ("memory.max", "memory.current", "memory.peak",
                                           "memory.events", "memory.pressure", "cpu.max"):
                                  record[name] = read(current / name)
                              row["cgroups"].append(record)
                              if current == root:
                                  break
                              current = current.parent
              processes = []
              for entry in Path("/proc").iterdir():
                  if not entry.name.isdecimal():
                      continue
                  try:
                      status = dict(line.split(":", 1) for line in (entry / "status").read_text().splitlines())
                      processes.append({"pid": int(entry.name), "ppid": int(status["PPid"]),
                                        "rss_kib": int(status.get("VmRSS", "0 kB").split()[0]),
                                        "comm": status["Name"].strip()})
                  except (OSError, KeyError, ValueError):
                      continue
              row["top_rss_processes"] = sorted(processes, key=lambda p: p["rss_kib"], reverse=True)[:12]
              return row

          while not stopped:
              try:
                  row = snapshot()
              except Exception as error:
                  row = {"utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                         "sampler_error": type(error).__name__}
              encoded = json.dumps(row, sort_keys=True)
              with output.open("a") as stream:
                  stream.write(encoded + "\n")
                  stream.flush()
              print("[determinism-resources] " + encoded, flush=True)
              for _ in range(15):
                  if stopped:
                      break
                  time.sleep(1)
          PY
          python3 -u "$evidence/sample.py" "$evidence/resources.jsonl" &
          sampler_pid=$!
          cleanup_sampler() {
            kill "$sampler_pid" 2>/dev/null || true
            wait "$sampler_pid" 2>/dev/null || true
          }
          trap cleanup_sampler EXIT
          set +e
          bash verification/runner/e2e/check_report_determinism.sh --profile merge 2>&1 | tee "$evidence/determinism.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${statuses[0]}" > "$evidence/verification-exit-code.txt"
          if [[ "${statuses[0]}" -ne 0 ]]; then
            exit "${statuses[0]}"
          fi
          exit "${statuses[1]}"
      - name: Preserve diagnostic observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: 95ff-determinism-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/95ff-determinism-diagnostic
          if-no-files-found: error
