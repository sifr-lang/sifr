name: local-first-validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-format:
    name: lint-and-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # Rust 1.98.0
      # Advisory until legacy workspace lint debt is burned down by a dedicated cleanup.
      - name: Rustfmt check (advisory)
        continue-on-error: true
        run: cargo fmt --check
      - name: Clippy workspace (advisory)
        continue-on-error: true
        run: cargo clippy --workspace -- -D warnings

  local-first-profiles:
    name: local-first-${{ matrix.profile }}
    runs-on: ubuntu-24.04
    # PRs run only create-pr for fast feedback; broader lanes run on push and manual workflows.
    if: github.event_name != 'pull_request' || matrix.profile == 'create-pr'
    strategy:
      fail-fast: true
      matrix:
        profile: [create-pr, merge, release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # Rust 1.98.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: verification/pyproject.toml
          checksum: 68a509da24b06b4223a1c0175fb5eb5bc79342b76cbeff0cfe51ac3f5b17b6b2
      - name: Install canonical Python interpreter
        run: uv python install 3.14.7
      - name: Provision Linux host-tool confinement
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap util-linux
          bwrap --version
          prlimit --version
      - name: Run local-first profile
        run: bash scripts/run_all_tests.sh --profile "${{ matrix.profile }}"

  smoke-fuzz-property:
    name: smoke-fuzz-property
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # Rust 1.98.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: verification/pyproject.toml
          checksum: 68a509da24b06b4223a1c0175fb5eb5bc79342b76cbeff0cfe51ac3f5b17b6b2
      - name: Run smoke fuzz/property checks
        run: uv run --project verification --locked python -m sifr_verify areas run --area fuzz_property --suite cargo-smoke --suite property --suite fuzz-smoke

  compiler-component-targets:
    name: compiler-component-${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # Rust 1.98.0
        with:
          targets: ${{ matrix.target }}
      - name: Run native compiler component qualification
        run: cargo test --locked -p sifr_compiler_component --target "${{ matrix.target }}"
      - name: Run native SQL build qualification
        run: python verification/areas/sql_platform/tools/run_sql_build_qualification.py --target "${{ matrix.target }}"

  sql-wasi-build:
    name: sql-build-wasm32-wasip2
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # Rust 1.98.0
        with:
          targets: wasm32-wasip2
      - name: Run WASI SQL build qualification
        run: python verification/areas/sql_platform/tools/run_sql_build_qualification.py --target wasm32-wasip2

  deterministic-report-signature:
    name: deterministic-report-signature
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # Rust 1.98.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: verification/pyproject.toml
          checksum: 68a509da24b06b4223a1c0175fb5eb5bc79342b76cbeff0cfe51ac3f5b17b6b2
      - name: Verify deterministic report signature
        run: bash verification/runner/e2e/check_report_determinism.sh --profile merge
