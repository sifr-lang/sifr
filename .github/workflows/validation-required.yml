name: validation-required-publisher

on:
  workflow_run:
    workflows: [local-first-validation]
    types: [completed]

permissions:
  contents: read

jobs:
  publish:
    if: contains(fromJSON('["pull_request", "merge_group", "push"]'), github.event.workflow_run.event)
    runs-on: ubuntu-24.04
    environment: validation-check-publication
    permissions:
      contents: read
      actions: read
    steps:
      # workflow_run uses the protected default-branch definition. This checkout
      # contains trusted publisher code; candidate objects are fetched as data.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version-file: verification/pyproject.toml
          checksum: 173d95a0c32d18c896c46ba6fafbf3cf9c14ab74b033f81b76c883ef492a976b
      - name: Mint the separate protected-check integration token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.VALIDATION_CHECK_APP_ID }}
          private-key: ${{ secrets.VALIDATION_CHECK_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write
      - name: Verify complete producer facts and publish exact-candidate aggregate
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_TOKEN: ${{ steps.app-token.outputs.token }}
          CHECK_APP_ID: ${{ vars.VALIDATION_CHECK_APP_ID }}
          VALIDATION_RUN_ID: ${{ github.event.workflow_run.id }}
          TRUSTED_WORKFLOW_SHA: ${{ github.sha }}
        run: uv run --project verification --locked python scripts/publish_validation_aggregate.py
