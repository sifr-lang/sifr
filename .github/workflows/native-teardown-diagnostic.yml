{
  "name": "native-production-executor-diagnostic",
  "on": {
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "observe": {
      "name": "harmless-production-executor-aarch64-apple-darwin",
      "runs-on": "macos-15",
      "timeout-minutes": 10,
      "env": {
        "SIFR_NATIVE_HOST_KIND": "dedicated-darwin",
        "PYTHONDONTWRITEBYTECODE": "1"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false
          }
        },
        {
          "uses": "astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d",
          "with": {
            "version-file": "verification/pyproject.toml",
            "checksum": "51c6170e8e3a01cef9f33b94f582b7b81ac65046f55d40afb35f9cff5a68c179"
          }
        },
        {
          "name": "Prepare explicit canonical interpreter",
          "run": "uv python install 3.14.7\nuv sync --project verification --locked"
        },
        {
          "name": "Observe harmless owned fixtures",
          "run": "\"$GITHUB_WORKSPACE/verification/.venv/bin/python\" -B verification/areas/sysroot_release/native_teardown_diagnostic.py observe --output \"$RUNNER_TEMP/native-teardown-diagnostic\""
        },
        {
          "name": "Check exact diagnostic evidence",
          "if": "always()",
          "run": "\"$GITHUB_WORKSPACE/verification/.venv/bin/python\" -B verification/areas/sysroot_release/native_teardown_diagnostic.py check --output \"$RUNNER_TEMP/native-teardown-diagnostic\""
        },
        {
          "name": "Retain failure and signal evidence",
          "if": "always()",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "native-teardown-diagnostic-${{ github.sha }}-aarch64-apple-darwin-${{ github.run_attempt }}",
            "path": "${{ runner.temp }}/native-teardown-diagnostic/evidence",
            "if-no-files-found": "error",
            "retention-days": 30
          }
        }
      ]
    }
  }
}
