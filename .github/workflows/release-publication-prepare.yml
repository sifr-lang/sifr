name: release-publication-prepare

on:
  workflow_call:
    inputs:
      channel:
        required: false
        default: ""
        type: string
      version:
        required: false
        default: ""
        type: string
      source_commit:
        required: false
        default: ""
        type: string
      governance_mode:
        required: true
        type: string
      bootstrap_alpha_version:
        required: false
        default: ""
        type: string
      evidence_commit:
        required: false
        default: ""
        type: string
      candidate_path:
        required: false
        default: ""
        type: string
      expected_plan_sha256:
        required: false
        default: ""
        type: string
      publication_mode:
        required: false
        default: ""
        type: string
    outputs:
      summary_sha256:
        value: ${{ jobs.prepare.outputs.summary_sha256 }}
      summary_artifact_name:
        value: ${{ jobs.prepare.outputs.summary_artifact_name }}
      plan_sha256:
        value: ${{ jobs.prepare.outputs.plan_sha256 }}
      release_report_sha256:
        value: ${{ jobs.prepare.outputs.release_report_sha256 }}
      qualification_sha256:
        value: ${{ jobs.prepare.outputs.qualification_sha256 }}
      live_index_sha256:
        value: ${{ jobs.prepare.outputs.live_index_sha256 }}
      proposed_index_sha256:
        value: ${{ jobs.prepare.outputs.proposed_index_sha256 }}
      version:
        value: ${{ jobs.prepare.outputs.version }}
      source_commit:
        value: ${{ jobs.prepare.outputs.source_commit }}
      proposed_generation:
        value: ${{ jobs.prepare.outputs.proposed_generation }}
      site_base_commit:
        value: ${{ jobs.prepare.outputs.site_base_commit }}

permissions:
  actions: read
  contents: read

jobs:
  prepare:
    name: prepare governed publication
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      summary_sha256: ${{ steps.outputs.outputs.summary_sha256 }}
      summary_artifact_name: ${{ steps.outputs.outputs.summary_artifact_name }}
      plan_sha256: ${{ steps.outputs.outputs.plan_sha256 }}
      release_report_sha256: ${{ steps.outputs.outputs.release_report_sha256 }}
      qualification_sha256: ${{ steps.outputs.outputs.qualification_sha256 }}
      live_index_sha256: ${{ steps.outputs.outputs.live_index_sha256 }}
      proposed_index_sha256: ${{ steps.outputs.outputs.proposed_index_sha256 }}
      version: ${{ steps.outputs.outputs.version }}
      source_commit: ${{ steps.outputs.outputs.source_commit }}
      proposed_generation: ${{ steps.outputs.outputs.proposed_generation }}
      site_base_commit: ${{ steps.outputs.outputs.site_base_commit }}
    env:
      GH_TOKEN: ${{ github.token }}
      CHANNEL: ${{ inputs.channel }}
      VERSION: ${{ inputs.version }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      GOVERNANCE_MODE: ${{ inputs.governance_mode }}
      BOOTSTRAP_ALPHA_VERSION: ${{ inputs.bootstrap_alpha_version }}
      EVIDENCE_COMMIT: ${{ inputs.evidence_commit }}
      CANDIDATE_PATH: ${{ inputs.candidate_path }}
      EXPECTED_PLAN_SHA256: ${{ inputs.expected_plan_sha256 }}
      PUBLICATION_MODE: ${{ inputs.publication_mode }}
      LEGACY_INDEX_SHA256: 71b3243925670f56dc510b8f45b6614a622f58097a0fea9492f61d20dc4bf9ef
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: ${{ inputs.governance_mode != 'ga-activation' && inputs.governance_mode != 'normal' }}
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ inputs.governance_mode != 'ga-activation' && inputs.governance_mode != 'normal' }}
        with:
          pattern: sifr-${{ inputs.version }}-*
          path: prepare-assets
          merge-multiple: true

      - name: Validate read-only prepare inputs and artifact bytes
        if: ${{ inputs.governance_mode != 'ga-activation' && inputs.governance_mode != 'normal' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${EVIDENCE_COMMIT}${CANDIDATE_PATH}${EXPECTED_PLAN_SHA256}${PUBLICATION_MODE}" ]]; then
            echo "::error::preview/bootstrap prepare cannot receive stable inputs"
            exit 2
          fi
          case "${GOVERNANCE_MODE}" in
            preview)
              [[ "${CHANNEL}" =~ ^(alpha|beta)$ ]] &&
                test -z "${BOOTSTRAP_ALPHA_VERSION}" || {
                echo "::error::preview mode requires alpha/beta and no bootstrap alpha"
                exit 2
              }
              ;;
            bootstrap-alpha)
              test "${CHANNEL}" = "alpha" && test -z "${BOOTSTRAP_ALPHA_VERSION}" || {
                echo "::error::bootstrap-alpha input mismatch"
                exit 2
              }
              ;;
            bootstrap-index)
              test "${CHANNEL}" = "beta" || {
                echo "::error::bootstrap-index requires beta"
                exit 2
              }
              [[ "${BOOTSTRAP_ALPHA_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]] || {
                echo "::error::bootstrap-index requires a fresh alpha version"
                exit 2
              }
              ;;
            *) echo "::error::unsupported governance_mode"; exit 2 ;;
          esac
          if [[ ! "${SOURCE_COMMIT}" =~ ^[0-9a-f]{40}$ ||
                "$(git rev-parse HEAD)" != "${SOURCE_COMMIT}" ]]; then
            echo "::error::prepare source identity mismatch"
            exit 2
          fi
          for target in \
            aarch64-apple-darwin \
            x86_64-apple-darwin \
            x86_64-unknown-linux-gnu \
            aarch64-unknown-linux-gnu
          do
            archive="prepare-assets/sifr-${VERSION}-${target}.tar.gz"
            checksum="${archive}.sha256"
            test -f "${archive}" && test -f "${checksum}" || {
              echo "::error::prepare artifact set is incomplete"
              exit 2
            }
            test "$(tr -d '[:space:]' <"${checksum}")" = \
              "$(sha256sum "${archive}" | awk '{print $1}')" || {
                echo "::error::prepare checksum mismatch for ${archive}"
                exit 2
              }
            scripts/distribution/verify_release_archive.py \
              "${archive}" \
              --version "${VERSION}" \
              --target "${target}"
          done
          scripts/distribution/generate_version_installer.sh \
            --version "${VERSION}" \
            --artifact-dir prepare-assets \
            --out "prepare-assets/sifr-installer-${VERSION}"
          mkdir -p prepare
          gh release download channels \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern channels.json \
            --dir prepare
          mv prepare/channels.json prepare/current-channels.json
          current_sha256="$(
            sha256sum prepare/current-channels.json | awk '{print $1}'
          )"
          if [[ "${GOVERNANCE_MODE}" == bootstrap-* ]]; then
            test "${current_sha256}" = "${LEGACY_INDEX_SHA256}" &&
              test "$(wc -c <prepare/current-channels.json | tr -d '[:space:]')" = "105" || {
                echo "::error::one-time bootstrap source is not the exact opaque v1 asset"
                exit 2
              }
          else
            scripts/distribution/release_governance.py validate \
              --kind release-index \
              --input prepare/current-channels.json \
              --require-canonical
          fi
          bootstrap_alpha_evidence_sha256=""
          if [[ "${GOVERNANCE_MODE}" == "bootstrap-index" ]]; then
            gh release download channels \
              --repo "${GITHUB_REPOSITORY}" \
              --pattern "schema-v2-bootstrap-alpha-${BOOTSTRAP_ALPHA_VERSION}.json" \
              --dir prepare
            scripts/distribution/release_governance.py validate \
              --kind schema-bootstrap-evidence \
              --input "prepare/schema-v2-bootstrap-alpha-${BOOTSTRAP_ALPHA_VERSION}.json" \
              --require-canonical
            test "$(
              jq -r '.stage + ":" + .alpha.version' \
                "prepare/schema-v2-bootstrap-alpha-${BOOTSTRAP_ALPHA_VERSION}.json"
            )" = "alpha-assets:${BOOTSTRAP_ALPHA_VERSION}" || {
              echo "::error::staged alpha evidence identity mismatch"
              exit 2
            }
            bootstrap_alpha_evidence_sha256="$(
              sha256sum \
                "prepare/schema-v2-bootstrap-alpha-${BOOTSTRAP_ALPHA_VERSION}.json" |
                awk '{print $1}'
            )"
          fi
          asset_digests="$(
            find prepare-assets -mindepth 1 -maxdepth 1 -type f -print0 |
              LC_ALL=C sort -z |
              xargs -0 sha256sum |
              jq -Rn '
                [inputs | capture("^(?<sha>[0-9a-f]{64})  prepare-assets/(?<name>.+)$")]
                | map({key:.name, value:.sha})
                | from_entries
              '
          )"
          jq -cnS \
            --arg mode "${GOVERNANCE_MODE}" \
            --arg channel "${CHANNEL}" \
            --arg version "${VERSION}" \
            --arg source "${SOURCE_COMMIT}" \
            --arg alpha "${BOOTSTRAP_ALPHA_VERSION}" \
            --arg alpha_evidence "${bootstrap_alpha_evidence_sha256}" \
            --arg current "${current_sha256}" \
            --argjson assets "${asset_digests}" \
            '{
              schema_version: 2,
              operation: $mode,
              channel: $channel,
              version: $version,
              source_commit: $source,
              bootstrap_alpha_version: $alpha,
              bootstrap_alpha_evidence_sha256: $alpha_evidence,
              current_index_sha256: $current,
              assets: $assets
            }' >prepare/summary.json
          summary_sha256="$(sha256sum prepare/summary.json | awk '{print $1}')"
          {
            echo "## Governed publication prepare"
            echo
            echo "- operation: \`${GOVERNANCE_MODE}\`"
            echo "- channel/version: \`${CHANNEL}\` / \`${VERSION}\`"
            echo "- source commit: \`${SOURCE_COMMIT}\`"
            echo "- current index SHA-256: \`${current_sha256}\`"
            echo "- prepare summary SHA-256: \`${summary_sha256}\`"
            if [[ -n "${BOOTSTRAP_ALPHA_VERSION}" ]]; then
              echo "- staged alpha: \`${BOOTSTRAP_ALPHA_VERSION}\`"
            fi
          } >>"${GITHUB_STEP_SUMMARY}"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: ${{ inputs.governance_mode == 'ga-activation' || inputs.governance_mode == 'normal' }}
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: governance-source
          persist-credentials: false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: ${{ inputs.governance_mode == 'ga-activation' || inputs.governance_mode == 'normal' }}
        with:
          ref: ${{ inputs.evidence_commit }}
          fetch-depth: 0
          path: stable-evidence
          persist-credentials: false

      - name: Resolve exact stable candidate identity
        id: stable
        if: ${{ inputs.governance_mode == 'ga-activation' || inputs.governance_mode == 'normal' }}
        shell: bash
        run: |
          set -euo pipefail
          test -z "${CHANNEL}${VERSION}${SOURCE_COMMIT}${BOOTSTRAP_ALPHA_VERSION}" &&
            [[ "${EVIDENCE_COMMIT}" =~ ^[0-9a-f]{40}$ ]] &&
            [[ "${CANDIDATE_PATH}" =~ ^plans/releases/candidates/[0-9]+\.[0-9]+\.[0-9]+$ ]] &&
            [[ "${EXPECTED_PLAN_SHA256}" =~ ^[0-9a-f]{64}$ ]] &&
            [[ "${PUBLICATION_MODE}" =~ ^(initial|resume)$ ]] || {
              echo "::error::stable prepare inputs are incomplete or malformed"
              exit 2
            }
          candidate="stable-evidence/${CANDIDATE_PATH}"
          plan="${candidate}/stable-release-plan.json"
          test -f "${plan}" &&
            test "$(sha256sum "${plan}" | awk '{print $1}')" = "${EXPECTED_PLAN_SHA256}" || {
              echo "::error::stable candidate plan identity mismatch"
              exit 2
            }
          candidate_version="${CANDIDATE_PATH##*/}"
          source_commit="$(jq -er '.source_commit' "${plan}")"
          [[ "${source_commit}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::stable plan source identity is malformed"
            exit 2
          }
          {
            echo "candidate_version=${candidate_version}"
            echo "source_commit=${source_commit}"
          } >>"${GITHUB_OUTPUT}"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: ${{ inputs.governance_mode == 'ga-activation' || inputs.governance_mode == 'normal' }}
        with:
          ref: ${{ steps.stable.outputs.source_commit }}
          fetch-depth: 0
          path: stable-source
          submodules: recursive
          persist-credentials: false

      - name: Prepare exact stable publication inputs
        if: ${{ inputs.governance_mode == 'ga-activation' || inputs.governance_mode == 'normal' }}
        shell: bash
        run: |
          set -euo pipefail
          candidate_version="${{ steps.stable.outputs.candidate_version }}"
          source_commit="${{ steps.stable.outputs.source_commit }}"
          candidate="stable-evidence/${CANDIDATE_PATH}"
          qualification="${candidate}/qualification-artifact-index.json"
          test -f "${qualification}" || {
            echo "::error::candidate qualification index is missing"
            exit 2
          }
          python3 governance-source/scripts/distribution/release_governance.py validate \
            --kind qualification-artifact-index \
            --input "${qualification}" \
            --require-canonical
          run_id="$(jq -er '.workflow.run_id' "${qualification}")"
          run_attempt="$(jq -er '.workflow.run_attempt' "${qualification}")"
          mkdir -p prepare
          python3 governance-source/scripts/distribution/fetch_qualification_artifacts.py \
            --qualification-index "${qualification}" \
            --repository "${GITHUB_REPOSITORY}" \
            --expected-source-commit "${source_commit}" \
            --out stable-assets
          gh release download channels \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern channels.json \
            --dir prepare
          mv prepare/channels.json prepare/current-channels.json
          mkdir prepare/history
          channels_release_id="$(
            gh api \
              "/repos/${GITHUB_REPOSITORY}/releases/tags/channels" \
              --jq '.id'
          )"
          while IFS= read -r snapshot; do
            [[ -n "${snapshot}" ]] || continue
            gh release download channels \
              --repo "${GITHUB_REPOSITORY}" \
              --pattern "${snapshot}" \
              --dir prepare/history
          done < <(
            gh api \
              --paginate \
              --slurp \
              "/repos/${GITHUB_REPOSITORY}/releases/${channels_release_id}/assets?per_page=100" |
              jq -er \
                '.[][] | .name
                 | select(test("^channels-generation-[1-9][0-9]*[.]json$"))'
          )
          proposed_generation="$(
            python3 governance-source/scripts/distribution/allocate_release_generation.py \
              --live-index prepare/current-channels.json \
              --snapshot-root prepare/history
          )"
          python3 governance-source/scripts/distribution/release_governance.py \
            prepare-stable-publication \
            --operation "${GOVERNANCE_MODE}" \
            --mode "${PUBLICATION_MODE}" \
            --evidence-root stable-evidence \
            --evidence-commit "${EVIDENCE_COMMIT}" \
            --candidate-path "${CANDIDATE_PATH}" \
            --expected-plan-sha256 "${EXPECTED_PLAN_SHA256}" \
            --source-root stable-source \
            --live-index prepare/current-channels.json \
            --snapshot-root prepare/history \
            --artifact-root stable-assets \
            --proposed-generation "${proposed_generation}" \
            --out prepare/summary.json
          test "$(jq -er '.qualification.run_id' prepare/summary.json)" = "${run_id}" &&
            test "$(jq -er '.qualification.run_attempt' prepare/summary.json)" = "${run_attempt}" &&
            test "$(jq -er '.version' prepare/summary.json)" = "${candidate_version}" || {
              echo "::error::stable prepare summary lost candidate identity"
              exit 2
            }
          summary_sha256="$(sha256sum prepare/summary.json | awk '{print $1}')"
          {
            echo "## Governed stable publication prepare"
            echo
            echo "- operation/mode: \`${GOVERNANCE_MODE}\` / \`${PUBLICATION_MODE}\`"
            echo "- candidate: \`${candidate_version}\` at \`${source_commit}\`"
            echo "- governance code: \`$(git -C governance-source rev-parse HEAD)\`"
            echo "- evidence: \`${EVIDENCE_COMMIT}:${CANDIDATE_PATH}\`"
            echo "- qualification run: \`${run_id}/${run_attempt}\`"
            echo "- live index: generation \`$(jq -r '.live_index.generation' prepare/summary.json)\`"
            echo "- proposed generation: \`$(jq -r '.mutation.proposed_index.generation' prepare/summary.json)\`"
            echo "- prepare summary SHA-256: \`${summary_sha256}\`"
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Bind prepare outputs
        id: outputs
        shell: bash
        run: |
          set -euo pipefail
          test -f prepare/summary.json
          summary_sha256="$(sha256sum prepare/summary.json | awk '{print $1}')"
          summary_artifact_name="publication-prepare-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "summary_sha256=${summary_sha256}" >>"${GITHUB_OUTPUT}"
          echo "summary_artifact_name=${summary_artifact_name}" >>"${GITHUB_OUTPUT}"
          {
            echo "plan_sha256=$(jq -r '.evidence.plan_sha256 // ""' prepare/summary.json)"
            echo "release_report_sha256=$(jq -r '.release_report.sha256 // ""' prepare/summary.json)"
            echo "qualification_sha256=$(jq -r '.qualification.sha256 // ""' prepare/summary.json)"
            echo "live_index_sha256=$(jq -r '.live_index.sha256 // ""' prepare/summary.json)"
            echo "proposed_index_sha256=$(jq -r '.mutation.proposed_index_sha256 // ""' prepare/summary.json)"
            echo "version=$(jq -r '.version // ""' prepare/summary.json)"
            echo "source_commit=$(jq -r '.source.commit // .source_commit // ""' prepare/summary.json)"
            echo "proposed_generation=$(jq -r '.mutation.proposed_index.generation // ""' prepare/summary.json)"
            echo "site_base_commit=$(jq -r '.site.base_commit // ""' prepare/summary.json)"
          } >>"${GITHUB_OUTPUT}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.outputs.outputs.summary_artifact_name }}
          path: prepare/summary.json
          if-no-files-found: error
          retention-days: 30
          overwrite: false
