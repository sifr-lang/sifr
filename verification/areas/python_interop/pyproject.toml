[project]
name = "sifr-python-interop-verification"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34,<2",
    "kafka-python>=2.0,<3",
    "numpy>=2,<3",
    "packaging>=24,<26",
    "pandas>=2.2,<3",
    "polars>=1,<2",
    "psycopg[binary]>=3.2,<4",
    "pyarrow>=16,<23",
    "redis>=5,<7",
    "scikit-learn>=1.5,<2",
    "testcontainers[kafka,localstack,postgres,redis]>=4.12,<5",
    "torch>=2.5,<3",
]

[tool.uv]
package = false
