[workspace]
resolver = "2"

[package]
name = "resource-lifecycle-runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
redis = { version = "=1.4.1", default-features = false, features = ["tokio-comp"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "json"] }
rusqlite = { version = "=0.39.0", features = ["bundled"] }
sifr_runtime = { path = "../../../../../../../crates/sifr_runtime" }
tokio = { version = "=1.52.3", features = ["io-util", "net", "rt", "sync", "time"] }
tokio-postgres = { version = "=0.7.18", default-features = false, features = ["runtime"] }

[package.metadata.sifr]
manifest = "sifr.toml"
