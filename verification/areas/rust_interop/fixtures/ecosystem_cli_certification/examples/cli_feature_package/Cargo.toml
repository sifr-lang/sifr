[workspace]
members = ["rust/anyhow_surface"]
resolver = "2"

[workspace.dependencies]
anyhow = { version = "=1.0.102", default-features = true }
clap = { version = "=4.6.1", default-features = true }
tracing = { version = "=0.1.44", default-features = true }
tracing-subscriber = { version = "=0.3.23", default-features = true, features = ["env-filter"] }

[package]
name = "cli-feature-package"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = { workspace = true }
anyhow_surface = { package = "sifr-anyhow-surface-probe", path = "rust/anyhow_surface" }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sifr_runtime = { path = "../../../../../../../crates/sifr_runtime" }

[package.metadata.sifr]
manifest = "sifr.toml"
