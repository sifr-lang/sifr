[workspace]
members = ["rust/cc", "rust/bindgen", "rust/cxx", "rust/zstd"]
resolver = "3"

[workspace.dependencies]
bindgen_upstream = { package = "bindgen", version = "=0.73.2", default-features = true }
cc_upstream = { package = "cc", version = "=1.4.5", default-features = true }
cxx = { version = "=1.0.200", default-features = true }
zstd_upstream = { package = "zstd", version = "=0.14.0", default-features = true }

[package]
name = "native-trust-package"
version = "0.1.0"
edition = "2024"

[dependencies]
bindgen = { package = "sifr-bindgen-probe", path = "rust/bindgen" }
cc = { package = "sifr-cc-probe", path = "rust/cc" }
cxx = { package = "sifr-cxx-probe", path = "rust/cxx" }
zstd = { package = "sifr-zstd-probe", path = "rust/zstd" }

[package.metadata.sifr]
manifest = "sifr.toml"
