[workspace]
resolver = "2"

[package]
name = "subscription-lifecycle-runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
futures = { version = "=0.3.33", default-features = true }
notify = { version = "=8.2.0", default-features = true }
redis = { version = "=1.4.1", default-features = false, features = ["tokio-comp"] }
sifr_runtime = { path = "../../../../../../../crates/sifr_runtime" }
tokio = { version = "=1.52.3", features = ["io-util", "net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false }

[package.metadata.sifr]
manifest = "sifr.toml"
