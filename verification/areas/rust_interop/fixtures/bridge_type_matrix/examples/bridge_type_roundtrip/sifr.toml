# fixture: bridge_type_matrix
# scenario-example: bridge_type_roundtrip

[package]
name = "bridge-type-roundtrip"
edition = "2026"
sifr-version = ">=0.3,<0.4"

[source]
root = "src"

[rust]
bridge-version = 1
bridges = ["src/bridges"]
direct-crate-bindings = true

[trust]
unsafe-rust-bridges = ["src/bridges/types.rs"]
rust-build-scripts = ["serde", "serde_json", "thiserror"]
rust-no-panic = [
  "bridge.types.serde_json_roundtrip",
  "bridge.types.bytes_roundtrip",
  "bridge.types.indexmap_roundtrip",
  "bridge.types.nested_indexmap_roundtrip",
  "bridge.types.indexmap_list_roundtrip",
]
